Лицо, временно находящееся на территории ЗАТО-87, обязано соблюдать установленные требования независимо от срока пребывания.

Статья 1.03. Территория действия
Кодекс действует на жилой территории ЗАТО-87, в общественных местах, на КПП, Периметре, в Зоне, на территории войсковой части и иных объектах, находящихся под контролем администрации ЗАТО.
Особый режим может устанавливаться для отдельных территорий, зданий, маршрутов и объектов.
Наличие специального режима не отменяет общих требований безопасности.

Статья 1.04. Основные понятия
Для целей настоящего Кодекса используются следующие понятия:
ЗАТО-87 — закрытая административно-территориальная единица, находящаяся под особым режимом контроля.
Периметр — охраняемая граница территории ЗАТО.
КПП — контрольно-пропускной пункт для проверки документов, транспорта и имущества.
КПП-Т — контрольно-пропускной пункт с усиленным режимом проверки.
Зона — территория с ограниченным или опасным доступом.
Войсковая часть — территория размещения подразделений ГвВК ЗАТО-87.
ГвВК ЗАТО-87 — военное командование, отвечающее за охрану и оборону территории.
Народная Милиция — подразделение, обеспечивающее общественный порядок и содействующее безопасности.
МГУ — уполномоченная структура, выполняющая установленные задачи контроля и обеспечения безопасности.
КПЗ — игровая мера временного задержания и изоляции нарушителя.
ЧС — чрезвычайная ситуация, требующая специальных мер защиты населения.

Глава 2. Основания и принципы ответственности

Статья 2.01. Основание ответственности
Ответственность наступает за действие или бездействие, прямо предусмотренное настоящим Кодексом.
Для назначения наказания должны быть установлены факт нарушения, причастность лица и обстоятельства произошедшего.
Предположения, слухи и неподтверждённые обвинения не являются достаточным основанием для наказания.

Статья 2.02. Вина нарушителя
Лицо несёт ответственность, если совершило нарушение умышленно либо по неосторожности в случаях, предусмотренных настоящим Кодексом.
Умышленным признаётся нарушение, совершённое при осознании запрета и последствий.
Неосторожным признаётся нарушение, совершённое вследствие невнимательности или пренебрежения очевидными требованиями безопасности.
Случайное действие, последствия которого лицо не могло предвидеть, само по себе не является основанием для наказания.

Статья 2.03. Необходимая оборона и защита других лиц
Не признаётся нарушением применение соразмерных мер для защиты собственной жизни, здоровья или жизни и здоровья другого лица от непосредственной угрозы.
Применённые меры должны быть направлены на прекращение опасности, а не на месть или расправу.
После устранения угрозы лицо обязано прекратить применение силы и, если это возможно, сообщить о произошедшем уполномоченным сотрудникам.

Статья 2.04. Крайняя необходимость
Не является нарушением действие, совершённое для предотвращения непосредственной угрозы жизни, здоровью или безопасности, если избежать её иным способом было невозможно.
Причинённый ущерб не должен явно превышать предотвращённый вред.
Лицо обязано сообщить о совершённых действиях после устранения опасности.

Статья 2.05. Добросовестное выполнение требований ЧС
Не подлежит наказанию лицо, которое добросовестно выполняло распоряжения по эвакуации, укрытию, санитарной обработке или спасению людей.
Вынужденное отклонение от обычного маршрута или режима допускается, если оно было необходимо для спасения жизни.
Настоящая статья не освобождает от ответственности за умышленное создание дополнительной угрозы.

Статья 2.06. Повторность нарушения
Повторным признаётся самостоятельное нарушение, совершённое лицом после ранее применённого взыскания в рамках того же игрового периода или установленного администрацией срока.
При повторном нарушении штраф может быть увеличен на 25% либо срок КПЗ — на 5 минут.
Увеличение не может приводить к превышению общих пределов наказания, установленных Кодексом.

Глава 3. Виды наказаний и порядок их назначения

Статья 3.01. Виды наказаний
За нарушение настоящего Кодекса могут назначаться:
Предупреждение.
Денежный штраф.
Помещение в КПЗ.
Возмещение причинённого материального ущерба.
Временное изъятие пропуска, разрешения или предмета, использованного при нарушении, если это предусмотрено правилами проекта.
Ограничение доступа к отдельному объекту или территории в рамках игрового режима.

Статья 3.02. Размер штрафа и срок КПЗ
Категория I — незначительное: штраф 100–500 ₽, КПЗ 0–3 мин
Категория II — лёгкое: штраф 500–1 500 ₽, КПЗ 3–7 мин
Категория III — среднее: штраф 1 500–3 000 ₽, КПЗ 7–15 мин
Категория IV — серьёзное: штраф 3 000–5 000 ₽, КПЗ 15–25 мин
Категория V — тяжёлое: штраф 5 000–7 500 ₽, КПЗ 25–40 мин
Категория VI — особо тяжёлое: штраф 7 500–10 000 ₽, КПЗ 40–50 мин

Статья 3.03. Предельные размеры наказаний
Максимальный штраф по одному разбирательству составляет 10 000 ₽.
Максимальный срок КПЗ по одному разбирательству составляет 50 минут.
Несколько нарушений могут учитываться одновременно, однако общие пределы наказания превышать запрещается.

Статья 3.04. Обстоятельства, смягчающие наказание
К смягчающим обстоятельствам относятся:
Добровольное признание нарушения.
Содействие проверке или расследованию.
Добровольное устранение последствий.
Отсутствие вреда и реальной угрозы.
Совершение нарушения вследствие понятного заблуждения при отсутствии умысла.

Статья 3.05. Обстоятельства, отягчающие наказание
К отягчающим обстоятельствам относятся:
Повторное совершение нарушения.
Умышленное создание угрозы жизни или здоровью.
Использование оружия или служебного положения.
Совершение нарушения во время тревоги или ЧС.
Попытка скрыть нарушение, уничтожить доказательства или переложить вину на другое лицо.

Статья 3.06. Порядок задержания и оформления
Задержание допускается при наличии достаточных оснований полагать, что лицо совершило нарушение, предусмотренное Кодексом.
Задержанному по возможности сообщаются причина задержания и предполагаемая статья.
При оформлении нарушения фиксируются обстоятельства, доказательства, объяснения лица и назначенная санкция.
Задержание не должно использоваться как способ давления, унижения или личной мести.

Статья 3.07. Право на обжалование
Лицо вправе обжаловать вынесенное решение уполномоченному командованию или администрации проекта.
Подача жалобы сама по себе не является нарушением.
Запрещается назначать дополнительное наказание исключительно за подачу жалобы или несогласие с решением.

ЧАСТЬ II. ОСОБЕННАЯ ЧАСТЬ

Раздел I. Нарушения пропускного и территориального режима

Глава 4. Доступ на территорию ЗАТО-87

Статья 1.01. Незаконное проникновение на территорию
Незаконным проникновением признаётся вход или въезд на территорию ЗАТО-87 без действующего пропуска, разрешения или иного установленного основания.
Нарушением также считается использование проходов, технических проёмов и иных путей, не предназначенных для обычного доступа.
Если лицо случайно оказалось за установленной границей и добровольно сообщило об этом охране, обстоятельства учитываются при рассмотрении дела.
Санкция: штраф 1 500 ₽ и 10 минут КПЗ.

Статья 1.02. Незаконное пересечение Периметра
Запрещается самостоятельно пересекать ограждение, охраняемую границу или иные обозначенные участки Периметра.
Запрещается повреждать ограждения, обходить посты наблюдения или использовать несанкционированные проходы.
Игнорирование предупреждений охраны признаётся отягчающим обстоятельством.
Санкция: 3 000 ₽ и 20 минут КПЗ. При сознательном игнорировании охраны — 5 000 ₽ и 30 минут КПЗ.

Статья 1.03. Подделка и использование чужого пропуска
Запрещается изготовление, изменение, передача или использование поддельного пропуска.
Запрещается предъявлять чужой документ, если он предназначен для личного использования.
Передача пропуска другому лицу допускается только при наличии официального разрешения.
Санкция: 2 500 ₽ и 15 минут КПЗ. При использовании подделки для проникновения на закрытый объект — 5 000 ₽ и 30 минут КПЗ.

Статья 1.04. Нарушение комендантского часа
Запрещается находиться вне разрешённых мест в период действия комендантского часа без уважительной причины или специального допуска.
Лицо обязано выполнять распоряжения патрулей и возвращаться в разрешённое место.
Не считается нарушением передвижение по прямому распоряжению уполномоченных сотрудников или при необходимости спасения жизни.
Санкция: 500 ₽ и 3 минуты КПЗ.

Статья 1.05. Самовольное посещение военного объекта
Запрещается входить на территорию войсковой части, складов, штабов, казарм, технических зон и иных военных объектов без допуска.
Наличие общего пропуска в ЗАТО не означает автоматического разрешения на посещение военных объектов.
Лицо обязано покинуть объект по первому законному требованию охраны.
Санкция: 2 500 ₽ и 15 минут КПЗ.

Статья 1.06. Нарушение установленного маршрута
Лицо, получившее разрешение на проход по определённому маршруту, обязано следовать указанному направлению.
Запрещается самовольно менять маршрут и приближаться к закрытым объектам.
При возникновении опасности лицо вправе отклониться от маршрута, если это необходимо для собственной безопасности.
Санкция: 750 ₽ и 5 минут КПЗ.

Статья 1.07. Незаконное нахождение в служебном помещении
Запрещается находиться в штабах, комнатах хранения, диспетчерских, медицинских и иных служебных помещениях без разрешения.
Запрещается использовать служебные помещения для личных целей без согласования.
Получив требование покинуть помещение, лицо обязано выполнить его, если требование не создаёт непосредственной угрозы жизни.
Санкция: 2 000 ₽ и 12 минут КПЗ.

Статья 1.08. Нарушение порядка сопровождения
Лицо, допущенное на режимную территорию в сопровождении, обязано находиться рядом с сопровождающим.
Запрещается самовольно отделяться от сопровождающего, заходить в другие помещения или передавать своё место другому лицу.
При потере сопровождающего необходимо остановиться в безопасном месте и связаться с охраной.
Санкция: 1 000 ₽ и 7 минут КПЗ.

Статья 1.09. Нахождение после окончания срока допуска
Лицо обязано покинуть режимный объект после окончания действия пропуска или разрешения.
Продление пребывания возможно только после получения нового разрешения.
Отказ покинуть территорию после уведомления признаётся самостоятельным нарушением.
Санкция: 1 000 ₽ и 5 минут КПЗ.

Раздел II. Нарушения общественного порядка

Глава 5. Порядок и взаимодействие с уполномоченными лицами

Статья 2.01. Неповиновение законному требованию
Запрещается умышленно не выполнять законные распоряжения сотрудников ГвВК, Народной Милиции, МГУ и охраны.
К таким требованиям относятся остановка, предъявление документов, освобождение прохода, соблюдение режима и выполнение распоряжений при тревоге.
Требование должно относиться к полномочиям сотрудника и не противоречить настоящему Кодексу.
Санкция: 2 000 ₽ и 10 минут КПЗ.

Статья 2.02. Создание препятствий военнослужащим
Запрещается намеренно мешать военнослужащим исполнять служебные обязанности.
Нарушением признаётся блокирование прохода, вмешательство в работу поста, препятствование перемещению подразделения или срыв служебных мероприятий.
Не считается нарушением случайное нахождение на пути, если лицо незамедлительно освободило проход после предупреждения.
Санкция: 2 500 ₽ и 15 минут КПЗ.

Статья 2.03. Нарушение работы КПП
Запрещается мешать проверке документов, досмотру транспорта и установленным процедурам пропуска.
Запрещается проникать через КПП вслед за другим лицом, обходить очередь или создавать помехи сотрудникам.
Запрещается самостоятельно перемещать барьеры, конусы и иные элементы организации движения.
Санкция: 2 000 ₽ и 10 минут КПЗ.

Статья 2.04. Оскорбительное поведение
Запрещается намеренно унижать, оскорблять или провоцировать гражданских лиц и сотрудников при исполнении ими обязанностей.
Критика действий сотрудника и несогласие с решением сами по себе не являются нарушением.
При рассмотрении дела учитываются форма высказывания, обстоятельства и наличие угроз.
Санкция: 750 ₽ и 3 минуты КПЗ.

Статья 2.05. Провокация общественного беспорядка
Запрещается умышленно провоцировать драки, массовые конфликты, беспорядки или столкновения.
Запрещается призывать к нападению на сотрудников охраны или препятствовать восстановлению порядка.
Если действия повлекли угрозу жизни или срыв эвакуации, применяется более строгая оценка обстоятельств.
Санкция: 3 000 ₽ и 20 минут КПЗ.

Статья 2.06. Распространение ложной тревожной информации
Запрещается сознательно распространять ложные сведения о нападении, заражении, прорыве Периметра, пожаре или иной угрозе.
Сообщение, переданное добросовестно на основании ошибочной информации, не считается заведомо ложным.
Особо тяжким нарушением признаётся ложное сообщение, вызвавшее массовую панику, эвакуацию или отвлечение сил охраны.
Санкция: 5 000 ₽ и 30 минут КПЗ. При особо серьёзном заведомо ложном сообщении — 8 000 ₽ и 45 минут КПЗ.

Статья 2.07. Сильное опьянение в общественном месте
Запрещается находиться в общественных и режимных местах в состоянии, при котором лицо не способно контролировать своё поведение и создаёт угрозу окружающим.
Сотрудники вправе потребовать покинуть опасную территорию или проследовать в безопасное место.
Само по себе состояние опьянения без нарушения порядка не должно автоматически влечь помещение в КПЗ.
Санкция: 1 000 ₽ и 5 минут КПЗ.

Статья 2.08. Укрывательство нарушителя
Запрещается сознательно скрывать лицо, совершившее серьёзное нарушение, предоставлять ему укрытие или помогать избегать законной проверки.
Запрещается уничтожать или скрывать доказательства по просьбе нарушителя.
Не считается укрывательством отказ от участия в конфликте или обращение за юридической/административной помощью.
Санкция: 4 000 ₽ и 25 минут КПЗ.

Раздел III. Нарушения правил обращения с оружием

Глава 6. Хранение, ношение и применение оружия

Статья 3.01. Ношение оружия без разрешения
Запрещается носить огнестрельное, холодное или иное оружие на территории ЗАТО-87 без соответствующего разрешения.
Разрешение должно быть действующим и соответствовать типу оружия и территории его ношения.
Обнаруженное оружие может быть временно изъято для проверки в рамках игрового порядка.
Санкция: 3 000 ₽ и 20 минут КПЗ.

Статья 3.02. Нарушение правил хранения оружия
Оружие должно храниться в предусмотренном месте и состоянии, исключающем случайное использование.
Запрещается оставлять оружие доступным для посторонних лиц.
Владелец обязан соблюдать требования по учёту и сохранности оружия.
Санкция: 1 500 ₽ и 10 минут КПЗ.

Статья 3.03. Передача оружия постороннему лицу
Запрещается передавать оружие лицу, не имеющему права на его получение и использование.
Запрещается давать оружие во временное пользование без установленного разрешения.
Владелец несёт ответственность за сознательную передачу оружия, даже если сам не участвовал в последующем нарушении.
Санкция: 4 000 ₽ и 25 минут КПЗ.

Статья 3.04. Оставление оружия без присмотра
Запрещается оставлять оружие в общественных местах, транспорте, помещениях общего доступа и иных местах, где его может получить посторонний.
При обнаружении утраты контроля над оружием владелец обязан незамедлительно сообщить уполномоченным сотрудникам.
Учитываются продолжительность оставления и доступность оружия посторонним.
Санкция: 2 000 ₽ и 12 минут КПЗ.

Статья 3.05. Пронос оружия на запрещённую территорию
Запрещается проносить оружие в места, где оно прямо запрещено режимом объекта.
Запрет распространяется на КПП, медицинские помещения, пункты эвакуации, склады и другие объекты с установленным ограничением.
Если оружие было добровольно предъявлено и сдано на временное хранение, состав нарушения отсутствует.
Санкция: 3 500 ₽ и 20 минут КПЗ.

Статья 3.06. Небезопасное обращение с оружием
Запрещается направлять оружие на людей без законной необходимости, демонстрировать его в угрожающей манере или совершать действия, создающие риск случайного выстрела.
Запрещается использовать оружие для запугивания или развлечения.
При наличии непосредственной угрозы жизни применяется более строгая оценка.
Санкция: 3 000 ₽ и 20 минут КПЗ.

Статья 3.07. Нахождение с оружием в состоянии опьянения
Запрещается носить или использовать оружие в состоянии, при котором лицо не способно безопасно контролировать его.
Лицо обязано сдать оружие уполномоченному сотруднику или обеспечить его безопасное хранение.
Отказ выполнить требование рассматривается как отягчающее обстоятельство.
Санкция: 4 000 ₽ и 25 минут КПЗ.

Статья 3.08. Необоснованное применение оружия
Запрещается применять оружие при отсутствии непосредственной угрозы, требующей такого применения.
Запрещается стрелять в целях устрашения, развлечения, демонстрации силы или разрешения бытового конфликта.
При создании реальной угрозы окружающим наказание усиливается.
Санкция: 7 000 ₽ и 40 минут КПЗ. При угрозе окружающим — 8 000 ₽ и 45 минут КПЗ.

Статья 3.09. Угроза оружием
Запрещается использовать оружие для запугивания, принуждения, вымогательства или давления на другое лицо.
Угроза может выражаться в демонстрации оружия, направлении его на человека или словесном предупреждении о намерении применить его.
Не считается нарушением законное предупреждение в рамках необходимой обороны, если оно соразмерно угрозе.
Санкция: 5 000 ₽ и 30 минут КПЗ.

Статья 3.10. Ложная ссылка на самооборону
Запрещается сознательно представлять необоснованное применение силы или оружия как необходимую оборону.
При рассмотрении дела устанавливаются характер угрозы, последовательность действий и момент прекращения опасности.
Ошибочная оценка ситуации сама по себе не доказывает умышленный обман.
Санкция: 7 500 ₽ и 40 минут КПЗ.

Статья 3.11. Сокрытие факта применения оружия
Лицо, применившее оружие, обязано сообщить об этом уполномоченным сотрудникам, если применение повлекло угрозу или вред.
Запрещается скрывать оружие, гильзы, следы применения или иные значимые обстоятельства с целью избежать проверки.
Добровольное сообщение до начала проверки учитывается как смягчающее обстоятельство.
Санкция: 3 500 ₽ и 20 минут КПЗ.

Статья 3.12. Несообщение об утрате оружия
Владелец обязан незамедлительно сообщить об утрате, краже или исчезновении оружия.
Запрещается скрывать факт утраты, если оружие может оказаться у постороннего лица.
При добровольном сообщении и содействии поиску наказание может быть смягчено.
Санкция: 2 500 ₽ и 15 минут КПЗ.

Статья 3.13. Незаконное завладение оружием
Запрещается присваивать, похищать или удерживать чужое оружие без разрешения.
Особо тяжким нарушением признаётся незаконное завладение военным оружием, оружием охраны или оружием, находившимся на режимном объекте.
Добровольный возврат предмета учитывается, но не отменяет ответственности за уже совершённое нарушение.
Санкция: 8 000 ₽ и 45 минут КПЗ. При завладении военным оружием — 10 000 ₽ и 50 минут КПЗ.

Статья 3.14. Использование оружия в бытовом конфликте
Запрещается применять или демонстрировать оружие для разрешения споров, ссор, имущественных и личных конфликтов.
Запрещается угрожать оружием из-за оскорбления, отказа выполнить просьбу или иного бытового разногласия.
Если действия повлекли вред здоровью, дополнительно рассматриваются соответствующие статьи Кодекса.
Санкция: 6 000 ₽ и 35 минут КПЗ.

Раздел IV. Нарушения режима войсковой части

Глава 7. Охраняемые объекты и имущество

Статья 4.01. Несанкционированная съёмка
Запрещается фотографировать, записывать видео или вести трансляцию с территории режимных объектов без разрешения.
Запрет распространяется на съёмку постов, систем охраны, складов, техники, документов и служебных помещений.
Съёмка в общественных местах, где она не запрещена отдельным режимом, сама по себе не является нарушением.
Санкция: 2 000 ₽ и 10 минут КПЗ.

Статья 4.02. Нарушение требований на КПП воинской части
Лицо обязано соблюдать порядок досмотра, предъявлять разрешённые документы и выполнять законные указания сотрудников КПП.
Запрещается скрывать предметы, препятствовать осмотру или пытаться пройти без завершения проверки.
При обнаружении запрещённого предмета сотрудник вправе потребовать его предъявления и дальнейшего оформления.
Санкция: 1 500 ₽ и 8 минут КПЗ.

Статья 4.03. Приближение к военному объекту с оружием
Запрещается приближаться к охраняемому военному объекту с оружием без соответствующего допуска.
Лицо обязано выполнить требование остановиться и отойти на безопасное расстояние.
Законное нахождение вооружённого сотрудника при исполнении обязанностей не подпадает под действие статьи.
Санкция: 3 500 ₽ и 20 минут КПЗ.

Статья 4.04. Незаконный вход в охраняемую зону
Запрещается проникать в помещения, ангары, склады, штабы, технические и иные охраняемые зоны без разрешения.
Запрещается использовать служебные двери и проходы в обход установленного порядка.
При наличии предупреждающих знаков или ограждений нарушение считается совершённым с осознанием запрета.
Санкция: 4 000 ₽ и 25 минут КПЗ.

Статья 4.05. Нарушение временного хранения оружия
При входе на объект с режимом временного хранения оружия лицо обязано передать оружие уполномоченному сотруднику.
Запрещается самовольно забирать оружие, менять место его хранения или передавать его другому лицу.
Получение оружия обратно осуществляется после завершения пребывания на объекте и проверки полномочий владельца.
Санкция: 3 000 ₽ и 20 минут КПЗ.

Статья 4.06. Отказ покинуть объект
Лицо обязано покинуть объект после законного требования уполномоченного сотрудника.
Отказ, затягивание выхода или попытка остаться в закрытой зоне признаются нарушением.
Исключение составляют ситуации, когда немедленный выход создаёт угрозу жизни, а также случаи, когда лицо оказывает необходимую помощь пострадавшему.
Санкция: 3 000 ₽ и 20 минут КПЗ.

Статья 4.07. Порча имущества войсковой части
Запрещается умышленно повреждать здания, ограждения, оборудование, транспорт, мебель, средства связи и иное имущество части.
Размер ущерба определяется по внутренней оценке проекта.
Умышленное повреждение критически важного оборудования признаётся отягчающим обстоятельством.
Санкция: от 3 000 до 7 000 ₽ и от 10 до 30 минут КПЗ, в зависимости от ущерба.

Статья 4.08. Самовольное использование служебного имущества
Запрещается использовать транспорт, оборудование, документы, средства связи и иное имущество части без разрешения.
Запрещается использовать служебные предметы в личных целях, если это не предусмотрено должностными обязанностями.
При причинении ущерба применяется также статья 9.17.
Санкция: 2 500 ₽ и 15 минут КПЗ.

Статья 4.09. Незаконное перемещение имущества
Запрещается выносить, перевозить или перемещать имущество части без разрешения ответственного лица.
Запрещается перемещать оружие, боеприпасы, оборудование, документы и иные предметы с режимных объектов.
При перемещении имущества с целью присвоения или сокрытия применяется усиленная санкция.
Санкция: 5 000 ₽ и 30 минут КПЗ. При особо серьёзных обстоятельствах — 7 500 ₽ и 40 минут КПЗ.

Статья 4.10. Нарушение служебной связи
Запрещается умышленно мешать работе служебных каналов связи.
Запрещается передавать ложные сообщения, занимать канал посторонними разговорами во время тревоги или раскрывать служебные сведения без разрешения.
Не считается нарушением передача срочного сообщения о непосредственной угрозе.
Санкция: 1 500 ₽ и 7 минут КПЗ.

Статья 4.11. Нарушение порядка в служебных помещениях
Запрещается создавать беспорядок, шум, мешать работе персонала или нарушать установленные правила нахождения в служебных помещениях.
Запрещается использовать помещения не по назначению без разрешения.
При повторном нарушении учитывается статья 2.06.
Санкция: 1 000 ₽ и 5 минут КПЗ.

Раздел V. Нарушения правил химической и биологической безопасности

Глава 8. Опасные вещества, заражение и санитарный режим

Статья 5.01. Игнорирование химической тревоги
После объявления химической тревоги лицо обязано прекратить обычную деятельность и следовать установленным инструкциям.
Запрещается игнорировать сигналы оповещения, препятствовать действиям персонала или намеренно оставаться в опасной зоне.
При невозможности выполнить распоряжение лицо обязано сообщить об этом ответственным сотрудникам.
Санкция: 2 000 ₽ и 10 минут КПЗ.

Статья 5.02. Самовольный выход из укрытия
Запрещается покидать назначенное укрытие до официального разрешения или отмены тревоги.
Запрещается самостоятельно проверять обстановку за пределами безопасной зоны.
Выход допускается при непосредственной угрозе внутри укрытия или по распоряжению уполномоченного сотрудника.
Санкция: 2 500 ₽ и 15 минут КПЗ.

Статья 5.03. Нарушение правил использования СИЗ
Лица, находящиеся в зоне риска, обязаны использовать выданные средства индивидуальной защиты в соответствии с инструкциями.
Запрещается намеренно снимать, повреждать или неправильно использовать СИЗ в опасной зоне.
Если средство защиты неисправно, лицо обязано сообщить об этом и запросить замену.
Санкция: 1 500 ₽ и 10 минут КПЗ.

Статья 5.04. Приближение к очагу заражения
Запрещается без разрешения приближаться к обозначенным очагам химического или биологического заражения.
Запрещается пересекать ограждения, предупреждающие знаки и установленные границы опасной зоны.
Сотрудники аварийных и медицинских служб действуют в соответствии со своими полномочиями.
Санкция: 4 000 ₽ и 25 минут КПЗ.

Статья 5.05. Нарушение санитарной обработки
Лицо обязано пройти назначенную санитарную обработку, если оно находилось в зоне возможного заражения.
Запрещается самовольно прекращать процедуру, покидать пункт обработки или препятствовать её проведению.
Медицинские и аварийные сотрудники обязаны соблюдать установленный порядок обработки и учёта.
Санкция: 2 000 ₽ и 10 минут КПЗ.

Статья 5.06. Игнорирование биологической опасности
Запрещается сознательно игнорировать предупреждения о биологической угрозе.
Запрещается посещать закрытые зоны, контактировать с потенциально опасными объектами или подвергать риску других лиц.
Добросовестное сообщение о подозрительном объекте или симптомах не является нарушением.
Санкция: 3 000 ₽ и 20 минут КПЗ.

Статья 5.07. Нарушение карантина
Запрещается самовольно покидать карантинную зону или принимать в ней посторонних без разрешения.
Запрещается скрывать факт контакта с заражённым объектом, если это может создать угрозу другим лицам.
Исключение допускается при непосредственной угрозе жизни и при отсутствии безопасной альтернативы.
Санкция: 5 000 ₽ и 30 минут КПЗ.

Статья 5.08. Сокрытие факта возможного заражения
Лицо обязано сообщить медицинскому персоналу о подтверждённом или предполагаемом контакте с опасным биологическим либо химическим агентом.
Запрещается сознательно скрывать сведения, которые могут повлиять на безопасность других лиц.
При подтверждённом заражении и намеренном сокрытии информации применяется усиленная санкция.
Санкция: 6 000 ₽ и 35 минут КПЗ. При особо серьёзных обстоятельствах — 8 000 ₽ и 45 минут КПЗ.

Статья 5.09. Нарушение обязательного медицинского осмотра
Лицо обязано пройти назначенный осмотр после пребывания в зоне риска, если такой осмотр предусмотрен режимом безопасности.
Запрещается препятствовать работе медицинского персонала или сознательно предоставлять ложные сведения.
Медицинский осмотр должен проводиться с соблюдением установленного порядка и уважением к лицу.
Санкция: 2 000 ₽ и 10 минут КПЗ.

Статья 5.10. Самовольное использование заражённых предметов
Запрещается подбирать, перемещать, использовать или передавать предметы, обозначенные как заражённые или потенциально опасные.
Запрещается снимать предупреждающую маркировку и нарушать изоляцию таких предметов.
При обнаружении подозрительного объекта необходимо сообщить ответственным службам.
Санкция: 5 000 ₽ и 30 минут КПЗ.

Статья 5.11. Нарушение порядка обращения с опасными веществами
Запрещается хранить, перемещать, вскрывать или использовать опасные вещества без соответствующего допуска.
Запрещается оставлять такие вещества в общественных местах или передавать их посторонним лицам.
Ответственные сотрудники обязаны соблюдать внутренний порядок учёта и безопасного обращения.
Санкция: 6 000 ₽ и 35 минут КПЗ.

Статья 5.12. Загрязнение безопасной территории
Запрещается умышленно переносить опасные вещества или потенциально заражённые предметы на безопасную территорию.
Запрещается нарушать установленные барьеры, изоляцию и санитарные зоны.
Намеренное загрязнение территории, повлёкшее угрозу массового заражения, признаётся особо тяжким нарушением.
Санкция: 7 000 ₽ и 40 минут КПЗ. При намеренном загрязнении — 10 000 ₽ и 50 минут КПЗ.

Статья 5.13. Нарушение правил использования воды и продуктов
Запрещается сознательно использовать воду или продукты, официально признанные непригодными или опасными.
Запрещается распространять такие продукты среди других лиц, скрывая сведения об их состоянии.
При сомнениях в безопасности продуктов лицо обязано обратиться к ответственному персоналу.
Санкция: 2 500 ₽ и 15 минут КПЗ.

Статья 5.14. Сокрытие опасного предмета
Запрещается скрывать предмет, который может представлять химическую, биологическую или иную угрозу.
Запрещается перемещать такой предмет с целью избежать проверки.
Добровольное сообщение о находке до начала проверки учитывается как смягчающее обстоятельство.
Санкция: 5 000 ₽ и 30 минут КПЗ.

Статья 5.15. Ложное сообщение об угрозе заражения
Запрещается сознательно сообщать ложные сведения о химическом или биологическом заражении.
Запрещается имитировать признаки заражения или создавать ложную тревогу с целью вызвать панику.
При заведомо ложном сообщении, вызвавшем масштабную эвакуацию или срыв работы служб, применяется максимальная санкция.
Санкция: 8 000 ₽ и 45 минут КПЗ. При заведомо ложной химической или биологической тревоге с тяжёлыми последствиями — 10 000 ₽ и 50 минут КПЗ.

Раздел VI. Нарушения правил гражданской обороны и поведения при ЧС

Глава 9. Эвакуация, укрытия и аварийная безопасность

Статья 6.01. Игнорирование сигнала гражданской обороны
После получения официального сигнала ГО лицо обязано прекратить обычную деятельность и выполнять инструкции.
Запрещается намеренно игнорировать оповещение, препятствовать эвакуации или отказываться от укрытия без уважительной причины.
Если сигнал не был услышан или распознан, ответственность не наступает без доказательства умысла или неосторожности.
Санкция: 2 000 ₽ и 10 минут КПЗ.

Статья 6.02. Нарушение порядка нахождения в укрытии
Находящиеся в укрытии обязаны соблюдать порядок, не блокировать входы и выходы и выполнять распоряжения ответственного лица.
Запрещается создавать конфликтные ситуации, повреждать оборудование и мешать размещению других людей.
Вынужденные действия для спасения жизни не признаются нарушением.
Санкция: 1 000 ₽ и 5 минут КПЗ.

Статья 6.03. Самовольное оставление пункта сбора
После эвакуации лицо обязано оставаться в назначенном пункте сбора до получения дальнейших инструкций.
Запрещается самостоятельно покидать пункт сбора, если это может затруднить учёт населения или подвергнуть лицо опасности.
При необходимости покинуть пункт сбора следует уведомить ответственного сотрудника.
Санкция: 2 000 ₽ и 10 минут КПЗ.

Статья 6.04. Препятствие эвакуации
Запрещается блокировать эвакуационные маршруты, мешать посадке в транспорт, задерживать людей или препятствовать работе эвакуационных групп.
Запрещается намеренно создавать заторы и препятствия в местах массового перемещения.
Намеренное препятствование массовой эвакуации признаётся тяжёлым нарушением.
Санкция: 5 000 ₽ и 30 минут КПЗ. При намеренном препятствовании массовой эвакуации — 7 500 ₽ и 40 минут КПЗ.

Статья 6.05. Создание паники
Запрещается сознательно провоцировать панику, распространять ложные сведения или создавать искусственную давку.
Запрещается выдавать себя за сотрудника службы спасения или военного командования с целью управления толпой.
Эмоциональная реакция на реальную опасность сама по себе не является нарушением.
Санкция: 4 000 ₽ и 25 минут КПЗ.

Статья 6.06. Распространение неподтверждённых сведений при ЧС
Запрещается выдавать неподтверждённые сведения за официальную информацию.
Лицо обязано обозначать сомнительные сведения как непроверенные и не создавать впечатление официального сообщения.
Добросовестная передача сообщения с указанием источника не считается нарушением.
Санкция: 1 500 ₽ и 7 минут КПЗ.

Статья 6.07. Препятствие спасательным службам
Запрещается мешать пожарным, медицинским, аварийным и эвакуационным группам.
Запрещается занимать их транспортные маршруты, вмешиваться в работу оборудования или препятствовать доступу к пострадавшим.
Намеренное вмешательство в спасательную операцию признаётся тяжёлым нарушением.
Санкция: 5 000 ₽ и 30 минут КПЗ. При намеренном препятствовании спасательной операции — 7 500 ₽ и 40 минут КПЗ.

Статья 6.08. Нарушение пожарной безопасности
Запрещается нарушать установленные правила обращения с огнём и пожароопасными предметами.
Запрещается хранить легковоспламеняющиеся предметы в запрещённых местах.
При обнаружении пожара лицо обязано сообщить о нём и не создавать дополнительных препятствий.
Санкция: 2 000 ₽ и 10 минут КПЗ.

Статья 6.09. Разведение открытого огня в запрещённом месте
Запрещается разводить костры, использовать открытое пламя или проводить огневые работы в местах, где это запрещено.
Запрещается оставлять источник огня без контроля.
При непосредственной угрозе пожара применяется усиленная оценка обстоятельств.
Санкция: 2 500 ₽ и 15 минут КПЗ.

Статья 6.10. Блокирование эвакуационных выходов
Запрещается загромождать двери, проходы, лестницы, коридоры и иные пути эвакуации.
Запрещается устанавливать предметы, препятствующие быстрому выходу людей.
Лицо, обнаружившее блокировку, обязано по возможности сообщить об этом ответственным сотрудникам.
Санкция: 3 500 ₽ и 20 минут КПЗ.

Статья 6.11. Возвращение в опасное здание
Запрещается возвращаться в здание, официально признанное опасным или эвакуированным, без разрешения ответственных служб.
Запрет действует до официального разрешения на возвращение.
Исключение допускается при необходимости спасения человека, если промедление создаёт непосредственную угрозу его жизни и нет возможности привлечь спасателей.
Санкция: 3 000 ₽ и 15 минут КПЗ.

Статья 6.12. Приближение к аварийным конструкциям
Запрещается приближаться к обрушенным зданиям, повреждённым сооружениям, аварийным коммуникациям и иным опасным конструкциям без разрешения.
Запрещается пересекать ограждения и предупреждающие знаки.
Сотрудники аварийных служб действуют в рамках своих обязанностей.
Санкция: 1 500 ₽ и 7 минут КПЗ.

Статья 6.13. Несообщение об аварии
Лицо обязано сообщить об обнаруженном пожаре, обрушении, утечке, повреждении коммуникаций или иной аварийной ситуации.
Запрещается сознательно скрывать сведения, если промедление может привести к ущербу или угрозе жизни.
Добросовестная попытка сообщить, если связь отсутствовала, учитывается при рассмотрении дела.
Санкция: 3 000 ₽ и 20 минут КПЗ.

Раздел VII. Нарушения режима охраны, Периметра и взаимодействия с техникой

Глава 10. Проверки, задержания и опасные зоны

Статья 7.01. Отказ предъявить документы
По законному требованию уполномоченного сотрудника лицо обязано предъявить документ, подтверждающий личность или право нахождения на территории.
Документы предъявляются в объёме, необходимом для проверки.
При отсутствии документа лицо обязано сообщить об этом и следовать установленному порядку идентификации.
Санкция: 1 500 ₽ и 8 минут КПЗ.

Статья 7.02. Невыполнение требования остановиться
При получении законного требования остановиться лицо обязано прекратить движение.
Запрещается намеренно скрываться, ускорять движение или менять маршрут с целью избежать проверки.
Если остановка создаёт непосредственную угрозу жизни, лицо должно выбрать безопасное место и сообщить о причине задержки.
Санкция: 2 000 ₽ и 10 минут КПЗ.

Статья 7.03. Сопротивление проверке
Запрещается физически или иным умышленным способом препятствовать законной проверке документов, вещей или транспорта.
Запрещается скрывать предметы, мешать осмотру или препятствовать работе сотрудников.
Спокойное несогласие с проверкой и последующее обжалование не являются сопротивлением.
Санкция: 3 000 ₽ и 20 минут КПЗ.

Статья 7.04. Сопротивление задержанию
Запрещается препятствовать законному задержанию, пытаться вырваться, скрыться или мешать оформлению.
Запрещается применять силу к сотрудникам, осуществляющим задержание.
При создании дополнительной угрозы жизни или здоровью применяется усиленная санкция.
Санкция: 4 500 ₽ и 25 минут КПЗ. При создании угрозы — 5 000 ₽ и 30 минут КПЗ.

Статья 7.05. Провокационное поведение в зоне охраны
Запрещается намеренно провоцировать сотрудников охраны на применение силы, срывать несение службы или создавать ложные основания для тревоги.
Запрещается имитировать нападение, попытку прорыва или иное опасное действие.
Законное обращение с жалобой или требованием разъяснить действия сотрудника нарушением не является.
Санкция: 1 500 ₽ и 8 минут КПЗ.

Статья 7.06. Приближение к военной технике
Запрещается приближаться к военной технике без разрешения, если она находится на стоянке, обслуживании или выполняет служебную задачу.
Запрещается касаться техники, открывать люки, двери и отсеки, а также пытаться проникнуть внутрь.
Сотрудники, имеющие служебный допуск, не подпадают под запрет при исполнении обязанностей.
Санкция: 2 000 ₽ и 10 минут КПЗ.

Статья 7.07. Нарушение границ опасной зоны
Запрещается пересекать обозначенные границы опасных участков, мест проведения операций и технических зон.
Запрещается снимать или перемещать ограждения и предупреждающие знаки.
При отсутствии видимых обозначений учитывается, было ли лицо надлежащим образом уведомлено об опасности.
Санкция: 3 000 ₽ и 20 минут КПЗ.

Статья 7.08. Пересечение маршрута военной техники
Запрещается самовольно выходить на маршрут движения военной техники.
Лицо обязано уступить дорогу колонне, выполнять сигналы регулировщиков и не создавать препятствий.
Случайное появление на маршруте при немедленном освобождении проезда не должно автоматически влечь максимальное наказание.
Санкция: 2 500 ₽ и 15 минут КПЗ.

Статья 7.09. Прикосновение к подозрительным предметам
Запрещается поднимать, вскрывать, перемещать или разбирать предметы, которые могут представлять опасность.
Запрещается самостоятельно проверять подозрительные устройства и неизвестные объекты.
Лицо обязано отойти на безопасное расстояние и сообщить о находке.
Санкция: 3 000 ₽ и 15 минут КПЗ.

Статья 7.10. Нарушение охраны Периметра
Запрещается вмешиваться в работу постов, систем наблюдения, средств контроля и охранных сооружений.
Запрещается отвлекать караул, подавать ложные сигналы или создавать препятствия охране.
Намеренное вмешательство, повлёкшее ослабление охраны, признаётся тяжёлым нарушением.
Санкция: 4 000 ₽ и 25 минут КПЗ. При намеренном вмешательстве — 7 500 ₽ и 40 минут КПЗ.

Статья 7.11. Несообщение об угрозе безопасности
Лицо обязано сообщить об обнаруженной попытке проникновения, подозрительной активности, угрозе нападения или повреждении охранных систем.
Запрещается сознательно скрывать такие сведения или препятствовать их передаче.
При невозможности немедленно связаться со службами лицо должно сообщить об угрозе при первой доступной возможности.
Санкция: 5 000 ₽ и 30 минут КПЗ.

Раздел VIII. Нарушения воинской и служебной дисциплины

Глава 11. Обязанности военнослужащих и сотрудников

Статья 8.01. Нарушение дисциплины
Военнослужащий или сотрудник обязан соблюдать установленный порядок, выполнять служебные обязанности и поддерживать дисциплину.
Запрещается самовольно нарушать распорядок, мешать работе подразделения или игнорировать установленные требования.
Незначительное нарушение без последствий может повлечь предупреждение вместо штрафа.
Санкция: 500 ₽ и 3 минуты КПЗ.

Статья 8.02. Нарушение требований к форме
Лицо, обязанное носить установленную форму, должно соблюдать требования к её комплектности и внешнему виду.
Запрещается использовать форму, знаки различия или элементы экипировки, не соответствующие должности или подразделению.
Исключение допускается при повреждении формы, отсутствии необходимого элемента или выполнении специального задания.
Санкция: 300 ₽ без помещения в КПЗ.

Статья 8.03. Нарушение порядка приветствия
Военнослужащие обязаны соблюдать установленный порядок приветствия и воинской вежливости.
Нарушением признаётся демонстративное игнорирование установленного приветствия без уважительной причины.
При отсутствии умысла применяется предупреждение.
Санкция: предупреждение без штрафа и КПЗ.

Статья 8.04. Самовольное оставление поста
Запрещается покидать назначенный пост без разрешения или передачи обязанностей другому уполномоченному лицу.
Во время тревоги, нападения или иной ЧС оставление поста без необходимости признаётся особо тяжёлым нарушением.
Если оставление поста было необходимо для спасения жизни или предотвращения непосредственной угрозы, ответственность не наступает при соблюдении принципов крайней необходимости.
Санкция: 5 000 ₽ и 30 минут КПЗ. Во время тревоги — 7 500 ₽ и 40 минут КПЗ.

Статья 8.05. Неисполнение приказа
Военнослужащий или сотрудник обязан исполнять законные приказы непосредственного командования.
Запрещается умышленно игнорировать приказ, затягивать его выполнение или выполнять его таким образом, чтобы сорвать поставленную задачу.
Приказ, исполнение которого создаёт очевидную непосредственную угрозу жизни либо выходит за пределы полномочий отдавшего его лица, подлежит проверке.
Неисполнение приказа во время ЧС или боевой тревоги рассматривается как отягчающее обстоятельство.
Санкция: 4 000 ₽ и 25 минут КПЗ. Во время ЧС — 7 500 ₽ и 40 минут КПЗ.

Статья 8.06. Ненадлежащее исполнение обязанностей
Запрещается выполнять служебные обязанности с умышленным пренебрежением установленными требованиями.
Нарушением признаётся необоснованное бездействие, невыполнение обязательной проверки или сознательное игнорирование служебной задачи.
Ошибка, вызванная отсутствием подготовки, неисправностью оборудования или объективной невозможностью выполнить задачу, учитывается отдельно.
Санкция: 2 000 ₽ и 10 минут КПЗ.

Статья 8.07. Нарушение распорядка войсковой части
Военнослужащие и сотрудники обязаны соблюдать установленный распорядок дня, порядок несения службы и правила нахождения на территории части.
Запрещается самовольно менять график, покидать место выполнения задачи или мешать распорядку подразделения.
Нарушение без серьёзных последствий может быть ограничено предупреждением по решению командования.
Санкция: 1 000 ₽ и 5 минут КПЗ.

Раздел IX. Дополнительные положения об ответственности

Глава 12. Повторные нарушения, ущерб и злоупотребления

Статья 9.01. Самовольное присвоение полномочий
Запрещается выдавать себя за военнослужащего, сотрудника Народной Милиции, МГУ, охраны или иное должностное лицо без соответствующего статуса.
Запрещается использовать форму, знаки различия, удостоверения или служебные обозначения для создания ложного впечатления о наличии полномочий.
Если такое действие использовалось для проникновения на объект, получения имущества или принуждения других лиц, обстоятельства признаются отягчающими.
Санкция: 4 000 ₽ и 25 минут КПЗ.

Статья 9.02. Незаконное распоряжение чужим имуществом
Запрещается распоряжаться чужим имуществом без согласия владельца или установленного полномочия.
К нарушению относятся самовольная передача, сокрытие, удержание или уничтожение чужих вещей.
Если имущество принадлежит войсковой части или режимному объекту, дополнительно применяется соответствующая статья раздела IV.
Санкция: 3 000 ₽ и 20 минут КПЗ.

Статья 9.03. Обман при прохождении проверки
Запрещается сознательно предоставлять ложные сведения о личности, цели посещения, наличии допуска или принадлежности имущества.
Запрещается предъявлять заведомо недостоверные документы и скрывать существенные сведения, необходимые для проверки безопасности.
Ошибка в документах, допущенная неумышленно, сама по себе не является основанием для максимального наказания.
Санкция: 2 500 ₽ и 15 минут КПЗ.

Статья 9.04. Подстрекательство к нарушению Кодекса
Запрещается умышленно склонять другое лицо к проникновению на закрытый объект, нарушению Периметра, незаконному применению оружия или созданию угрозы безопасности.
Ответственность наступает при наличии доказательств целенаправленного побуждения к нарушению.
Простое обсуждение правил или выражение мнения не является подстрекательством.
Санкция: 3 500 ₽ и 20 минут КПЗ.

Статья 9.05. Организация группового нарушения
Запрещается организовывать группу лиц для совместного нарушения пропускного режима, нападения на охрану, проникновения на режимный объект или срыва эвакуации.
Организатором признаётся лицо, которое планировало действия, распределяло роли или координировало участников.
Участие каждого лица оценивается отдельно с учётом его фактических действий.
Санкция: 5 000 ₽ и 30 минут КПЗ.

Статья 9.06. Использование чужих документов или идентификаторов
Запрещается использовать чужое удостоверение, пропуск, жетон, регистрационный номер или иной идентификатор для обхода установленных ограничений.
Запрещается передавать такие сведения посторонним для совершения аналогичных действий.
Если использование документа повлекло проникновение на закрытый объект, применяется также статья 1.03.
Санкция: 2 500 ₽ и 15 минут КПЗ.

Статья 9.07. Умышленное повреждение средств безопасности
Запрещается повреждать, отключать или выводить из строя средства наблюдения, сигнализации, оповещения, ограждения и контроля доступа.
Запрещается вмешиваться в работу таких средств без разрешения ответственного персонала.
Если действие повлекло нарушение охраны или возникновение угрозы, применяется усиленная санкция.
Санкция: 6 000 ₽ и 35 минут КПЗ.

Статья 9.08. Незаконное использование служебной информации
Запрещается без разрешения передавать посторонним сведения о расположении постов, маршрутах патрулей, режиме охраны и уязвимостях объектов.
Запрещается использовать служебную информацию для обхода проверок или создания угрозы безопасности.
Не считается нарушением передача информации уполномоченному сотруднику для предотвращения опасности.
Санкция: 5 000 ₽ и 30 минут КПЗ.

Статья 9.09. Уничтожение или сокрытие доказательств
Запрещается умышленно уничтожать, изменять, скрывать или подделывать материалы, имеющие значение для рассмотрения нарушения.
К таким материалам относятся записи, документы, предметы, следы происшествия и сведения очевидцев.
Добросовестное удаление личных данных, не относящихся к делу, не является нарушением.
Санкция: 4 000 ₽ и 25 минут КПЗ.

Статья 9.10. Ложное обвинение
Запрещается сознательно сообщать уполномоченным лицам заведомо ложные сведения о совершении другим лицом нарушения.
Ошибочное сообщение, сделанное добросовестно и без намерения навредить, не подпадает под действие статьи.
При использовании ложного обвинения для задержания, наказания или преследования другого лица применяется усиленная санкция.
Санкция: 4 000 ₽ и 25 минут КПЗ.

Статья 9.11. Умышленное создание помех работе служб
Запрещается намеренно мешать работе медицинских, аварийных, транспортных, коммунальных и иных служб ЗАТО-87.
Нарушением признаётся блокирование доступа, повреждение рабочего оборудования, срыв вызова или препятствование выполнению служебной задачи.
Если действия создали угрозу жизни, применяются также соответствующие статьи разделов V и VI.
Санкция: 3 500 ₽ и 20 минут КПЗ.

Статья 9.12. Незаконное удержание чужого имущества
Запрещается удерживать найденное или переданное имущество, если владелец или уполномоченное лицо потребовали его возврата и отсутствуют законные основания для удержания.
Найденные документы, оружие, средства связи и режимные предметы должны быть переданы ответственным сотрудникам.
Добросовестное временное хранение найденной вещи до передачи ответственному лицу не является нарушением.
Санкция: 2 500 ₽ и 15 минут КПЗ.

Статья 9.13. Нарушение установленного порядка досмотра
Запрещается сознательно нарушать порядок досмотра транспорта, имущества и личных вещей, установленный для соответствующего объекта.
Запрещается скрывать запрещённые предметы или препятствовать проверке.
Проверка должна проводиться уполномоченным лицом и в пределах установленного режима.
Санкция: 2 000 ₽ и 10 минут КПЗ.

Статья 9.14. Неисполнение требования о передаче опасного предмета
Если у лица обнаружен предмет, создающий непосредственную угрозу безопасности, уполномоченный сотрудник вправе потребовать прекратить его использование и передать предмет для проверки.
Запрещается намеренно скрывать такой предмет, перемещать его или препятствовать его безопасному изъятию.
При отсутствии реальной опасности и споре о принадлежности предмета вопрос разрешается в установленном порядке без самовольного присвоения имущества.
Санкция: 4 000 ₽ и 25 минут КПЗ.

Статья 9.15. Повторное нарушение
При повторном совершении нарушения в пределах установленного срока наказание может быть увеличено.
Увеличение производится путём повышения штрафа на 25% либо увеличения срока КПЗ на 5 минут.
Одновременное увеличение штрафа и срока допускается только при наличии нескольких самостоятельных отягчающих обстоятельств.
Предельные значения наказаний, установленные статьёй 3.03, не могут быть превышены.
Санкция: увеличение основного наказания в указанных пределах.

Статья 9.16. Совершение нескольких нарушений
Если действия лица содержат признаки нескольких самостоятельных нарушений, каждое из них указывается в материалах разбирательства.
При назначении наказания учитываются характер действий, последствия и связь между нарушениями.
Общий штраф за одно разбирательство не может превышать 10 000 ₽.
Общий срок КПЗ за одно разбирательство не может превышать 50 минут.
Одно и то же действие не должно искусственно учитываться как несколько нарушений, если оно представляет собой единый эпизод, уже охватываемый одной статьёй.
Санкция: определяется по совокупности статей с соблюдением общих пределов.

Статья 9.17. Возмещение материального ущерба
Лицо, причинившее материальный ущерб имуществу граждан, ЗАТО-87 или войсковой части, обязано возместить его в установленном игровом порядке.
Размер возмещения определяется по внутренней оценке проекта с учётом характера повреждения и стоимости восстановления.
Возмещение ущерба применяется дополнительно к штрафу или КПЗ и не считается самостоятельным штрафом.
При отсутствии доказательств причинения ущерба требование о возмещении не назначается.
Санкция: возмещение установленного ущерба дополнительно к основному наказанию.

Статья 9.18. Злоупотребление служебным положением
Запрещается использовать должность, звание, доступ или служебные полномочия для личной выгоды, давления на граждан, незаконного задержания или назначения необоснованного наказания.
Запрещается применять служебные полномочия в личном конфликте.
Сотрудник обязан действовать в пределах предоставленных полномочий и соблюдать требования настоящего Кодекса.
При наличии признаков нескольких нарушений дополнительно применяются соответствующие статьи.
Санкция: до 7 500 ₽ и до 40 минут КПЗ.

Раздел X. Нарушения, связанные с исполнением служебных полномочий

Глава 13. Ответственность должностных лиц и сотрудников охраны

Статья 10.01. Незаконное задержание
Запрещается задерживать лицо без предусмотренных Кодексом оснований.
Запрещается удерживать человека после прекращения оснований для задержания, если отсутствует иное законное распоряжение.
При задержании сотрудник обязан сообщить причину и оформить произошедшее.
Санкция: 5 000 ₽ и 30 минут КПЗ.

Статья 10.02. Превышение служебных полномочий
Запрещается совершать действия, явно выходящие за пределы полномочий, предоставленных сотруднику.
К таким действиям относятся необоснованное применение силы, незаконное изъятие имущества, принуждение и использование служебного статуса в личных целях.
При наличии непосредственной угрозы сотрудник вправе принять необходимые меры в пределах правил необходимой обороны и крайней необходимости.
Санкция: 6 000 ₽ и 35 минут КПЗ.

Статья 10.03. Необоснованное применение силы
Запрещается применять физическую силу без необходимости либо продолжать её применение после прекращения угрозы.
Применение силы должно соответствовать характеру опасности и быть направлено на её прекращение.
Факт сопротивления задерживаемого сам по себе не оправдывает любые действия сотрудника.
Санкция: 5 000 ₽ и 30 минут КПЗ.

Статья 10.04. Незаконное изъятие имущества
Запрещается изымать личное или служебное имущество без предусмотренного основания.
Изъятие должно быть связано с проверкой безопасности, оформлением нарушения или иным установленным игровым порядком.
Сотрудник обязан зафиксировать изъятые предметы и обеспечить их сохранность.
Санкция: 4 500 ₽ и 25 минут КПЗ.

Статья 10.05. Фальсификация служебных материалов
Запрещается подделывать рапорты, записи задержаний, результаты проверок и иные служебные материалы.
Запрещается намеренно искажать обстоятельства происшествия или удалять сведения, имеющие значение для разбирательства.
Добросовестная ошибка при оформлении документа должна быть исправлена и сама по себе не означает фальсификацию.
Санкция: 7 000 ₽ и 40 минут КПЗ.

Статья 10.06. Бездействие при непосредственной угрозе
Сотрудник, на которого возложена обязанность реагировать на угрозы безопасности, не должен намеренно уклоняться от выполнения этой обязанности.
Нарушением признаётся сознательное игнорирование очевидной угрозы жизни, нападения, пожара, заражения или аварии при наличии реальной возможности сообщить о ней либо принять предусмотренные меры.
Не считается нарушением объективная невозможность действовать, отсутствие необходимых средств или ситуация, когда вмешательство создало бы ещё большую угрозу.
Санкция: 5 000 ₽ и 30 минут КПЗ.

ЧАСТЬ III. ПОРЯДОК ПРИМЕНЕНИЯ КОДЕКСА

Глава 14. Рассмотрение нарушений и вынесение решений

Статья 11.01. Установление факта нарушения
До назначения наказания уполномоченное лицо обязано установить обстоятельства происшествия.
В качестве доказательств могут использоваться:
видеозаписи и скриншоты;
показания очевидцев;
служебные рапорты;
записи камер наблюдения;
документы и пропуска;
иные материалы, относящиеся к происшествию.
Доказательства должны относиться к конкретному нарушению и позволять установить причастность лица.

Статья 11.02. Оформление наказания
В решении о наказании указываются:
имя или игровой идентификатор нарушителя;
номер статьи;
краткое описание нарушения;
обстоятельства и доказательства;
размер штрафа;
срок КПЗ;
должность или игровой идентификатор сотрудника, вынесшего решение.
Наказание без указания конкретной статьи не допускается.
При отсутствии достаточных доказательств лицо не должно признаваться виновным.

Статья 11.03. Полномочия сотрудников
Назначать наказания вправе только сотрудники и должностные лица, которым такие полномочия предоставлены правилами проекта.
Военнослужащий, сотрудник Народной Милиции или МГУ не вправе самостоятельно назначать наказание вне предоставленных ему полномочий.
Сотрудник обязан действовать беспристрастно и не использовать разбирательство для решения личных конфликтов.

Статья 11.04. Исполнение наказания
Штраф и помещение в КПЗ исполняются в установленном игровом порядке.
При назначении наказания учитываются все обстоятельства дела и ограничения настоящего Кодекса.
Повторное наказание за одно и то же нарушение без новых оснований не допускается.
Возмещение материального ущерба оформляется отдельно от основного наказания.

Статья 11.05. Обжалование решения
Нарушитель вправе обратиться к вышестоящему командованию или администрации проекта.
В жалобе указываются обжалуемая статья, обстоятельства дела и причины несогласия.
Рассматривающее жалобу лицо вправе оставить наказание без изменения, уменьшить его, отменить или направить дело на повторное рассмотрение.
Запрещается преследовать лицо за добросовестное использование права на обжалование.

Статья 11.06. Запрет необоснованного наказания
Запрещается назначать наказание на основании личной неприязни, предположений или неподтверждённых обвинений.
Запрещается увеличивать наказание исключительно из-за спора с сотрудником.
Запрещается применять положения Кодекса задним числом к действиям, которые на момент совершения не были запрещены.
Любые неустранимые сомнения в обстоятельствах происшествия трактуются в пользу предполагаемого нарушителя.

Заключительные положения

Статья 12.01. Приоритет требований безопасности
При возникновении чрезвычайной ситуации требования по спасению жизни, эвакуации, укрытию и предотвращению распространения опасности имеют приоритет перед обычным распорядком территории.

Статья 12.02. Соотношение общих и специальных статей
Если нарушение одновременно подпадает под общую и специальную статью, преимущественно применяется специальная статья.
Если совершены несколько самостоятельных нарушений, допускается применение нескольких статей с учётом статьи 9.16.
Двойное наказание за одно и то же действие под разными формулировками не допускается.

Статья 12.03. Предельные меры ответственности
Максимальный штраф за одно разбирательство — 10 000 ₽.
Максимальный срок помещения в КПЗ за одно разбирательство — 50 минут.
Возмещение доказанного материального ущерба может назначаться дополнительно к основному наказанию.
Превышение установленных пределов не допускается даже при наличии нескольких отягчающих обстоятельств.

Статья 12.04. Вступление Кодекса в силу
Кодекс вступает в силу после утверждения администрацией или уполномоченным руководством ЗАТО-87.
Изменения и дополнения публикуются отдельными поправками.
Все ранее действовавшие положения, противоречащие настоящему Кодексу, подлежат приведению в соответствие с ним.

const HOLIDAYS_ALL=[...HOLIDAYS_FEDERAL,...HOLIDAYS_MILITARY,...HOLIDAYS_PROF];
function holidaysOn(dateStr){
  const [y,m,d]=dateStr.split('-').map(Number);
  return HOLIDAYS_ALL.filter(h=>h.m===m&&h.d===d);
}
function upcomingHolidays(days=30){
  const out=[];
  const today=new Date();
  for(let i=0;i<days;i++){
    const dt=new Date(today.getFullYear(),today.getMonth(),today.getDate()+i);
    const ds=dt.toISOString().slice(0,10);
    const list=holidaysOn(ds);
    list.forEach(h=>out.push({...h,date:ds,daysAhead:i}));
  }
  return out;
}
function nextHoliday(){const list=upcomingHolidays(366);return list[0]||null}

function focusWin(id){
  const w=windows.get(id);if(!w)return;
  w.min=false;w.el.classList.remove('hidden');
  windows.forEach(v=>v.el.classList.remove('focused'));
  w.el.classList.add('focused');w.el.style.zIndex=++z;focused=id;renderTasks();
}
function renderTasks(){
  const b=$('#tasks');b.innerHTML='';
  windows.forEach((w,id)=>{
    const btn=document.createElement('button');
    btn.className='task'+(id===focused&&!w.min?' active':'');
    btn.title=APPS[id].name;
    btn.innerHTML=icon(APPS[id].icon)+E(APPS[id].name);
    btn.onclick=()=>{if(focused===id&&!w.min)minimize(id);else focusWin(id)};
    b.appendChild(btn);
  });
}
function minimize(id){const w=windows.get(id);if(!w)return;w.min=true;w.el.classList.add('hidden');if(focused===id)focused='';renderTasks();saveLayout()}
function toggleMax(id){const w=windows.get(id);if(!w)return;w.el.classList.toggle('max');focusWin(id);saveLayout()}
function closeWin(id){
  const w=windows.get(id);if(!w)return;
  if(DOCS[id])flushDoc(id);
  if(id==='notes')saveNote();
  if(id==='media'){const p=$('#player',w.el);if(p)p.pause()}
  if(id==='tetris'&&typeof tetrisInterval==='number'){clearInterval(tetrisInterval);tetrisInterval=null}
  if(id==='snake'&&typeof snakeInterval==='number'){clearInterval(snakeInterval);snakeInterval=null}
  if(id==='radio'&&typeof radioTimer==='number'){clearInterval(radioTimer);radioTimer=null}
  if(w.observer)w.observer.disconnect();
  w.el.remove();windows.delete(id);
  if(focused===id){focused='';const next=[...windows.keys()].reverse().find(k=>!windows.get(k).min);if(next)focusWin(next)}
  renderTasks();saveLayout();
}
function saveLayout(){
  if(!state.settings.restore)return;
  windows.forEach((w,id)=>{state.layout[id]={left:parseInt(w.el.style.left)||0,top:parseInt(w.el.style.top)||0,width:w.el.offsetWidth||800,height:w.el.offsetHeight||600,max:w.el.classList.contains('max'),min:w.min,open:true}});
  for(const k of Object.keys(state.layout))if(!windows.has(k))state.layout[k].open=false;
  queueSave();
}
function openApp(id){
  if(!APPS[id])return;
  if(!canAccess(id)){toast('Доступ запрещён для роли «'+currentRole()+'»',true);return}
  closeStart();$('#context').style.display='none';
  if(windows.has(id)){focusWin(id);return}
  const el=document.createElement('section');
  el.className='window';el.dataset.app=id;el.setAttribute('aria-label',APPS[id].name);
  const small=['calc','mines','tetris','snake','tictactoe'].includes(id),layout=state.settings.restore?state.layout[id]:null;
  const n=windows.size;
  el.style.cssText='left:'+Math.max(0,Math.min(Number(layout?.left)||28+n*20,innerWidth-300))+'px;top:'+Math.max(0,Math.min(Number(layout?.top)||22+n*16,innerHeight-160))+'px;width:'+Math.max(300,Math.min(Number(layout?.width)||(small?420:1000),innerWidth-8))+'px;height:'+Math.max(220,Math.min(Number(layout?.height)||(small?500:640),innerHeight-40))+'px';
  el.innerHTML='<header class="titlebar">'+icon(APPS[id].icon)+'<span class="wtitle">'+E(APPS[id].name)+'</span><div class="controls">'+button('min','_','title="Свернуть"')+button('max','□','title="Развернуть"')+button('close','×','title="Закрыть"')+'</div></header><div class="menubar">'+button('winmenu','Окно')+button('refresh','Обновить')+button('open','Справка','data-app="about"')+'</div><div class="content"></div><div class="status"><span>МСВС 1.0 · Локальная база</span><span>CORE</span></div>';
  $('#windows').appendChild(el);
  windows.set(id,{el,min:false});
  if(layout?.max)el.classList.add('max');
  el.addEventListener('pointerdown',()=>focusWin(id));
  const bar=$('.titlebar',el);
  bar.ondblclick=e=>{if(!e.target.closest('button'))toggleMax(id)};
  bar.onpointerdown=e=>{
    if(e.button!==0||e.target.closest('button')||el.classList.contains('max'))return;
    const r=el.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top;
    bar.setPointerCapture(e.pointerId);
    const move=ev=>{el.style.left=Math.max(0,Math.min(innerWidth-100,ev.clientX-ox))+'px';el.style.top=Math.max(0,Math.min(innerHeight-80,ev.clientY-oy))+'px'};
    const end=()=>{bar.removeEventListener('pointermove',move);saveLayout()};
    bar.addEventListener('pointermove',move);
    bar.addEventListener('pointerup',end,{once:true});
    e.preventDefault();
  };
  const observer=new ResizeObserver(()=>{clearTimeout(windows.get(id)?.resizeTimer);const w=windows.get(id);if(w)w.resizeTimer=setTimeout(saveLayout,250)});
  windows.get(id).observer=observer;observer.observe(el);
  focusWin(id);renderApp(id);
  audit('Открытие приложения',APPS[id].name);
  saveLayout();
}

    +'<p class="muted" style="margin-top:8px">Черновик сохраняется после ввода. Новая версия в архиве создаётся только кнопкой «Сохранить редакцию».</p></form></section>'

function saveDoc(type){
  const d=collectDoc(type);
  if(!d.subject?.trim()||!d.body?.trim())return toast('Укажите тему и содержание документа.',true);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date||''))return toast('Укажите дату документа.',true);
  let doc=state.docs.find(x=>x.id===d.id);
  if(!doc){
    const year=d.date.slice(0,4),key=type+'-'+year;
    state.seq[key]=Math.max(Number(state.seq[key])||0,...state.docs.filter(x=>x.type===type&&x.year===year).map(x=>Number(x.seq)||0))+1;
    const number=d.number?.trim()||DOCS[type].prefix+'-'+year+'-'+String(state.seq[key]).padStart(4,'0');
    if(state.docs.some(x=>x.number===number))return toast('Этот номер уже используется в архиве.',true);
    doc={id:uid(),type,year,seq:state.seq[key],number,created:new Date().toISOString(),versions:[],status:'Черновик'};
    state.docs.unshift(doc);
  }else if(d.number&&d.number!==doc.number){
    if(state.docs.some(x=>x.id!==doc.id&&x.number===d.number))return toast('Этот номер уже используется.',true);
    doc.number=d.number;
  }
  const fields={...d,id:doc.id,number:doc.number};delete fields.preset;
  doc.fields=fields;doc.title=d.subject;doc.updated=new Date().toISOString();
  doc.versions=Array.isArray(doc.versions)?doc.versions:[];
  doc.versions.push({n:doc.versions.length+1,time:doc.updated,fields:JSON.parse(JSON.stringify(fields))});
  state.drafts[type]={...fields,status:doc.status};
  audit('Сохранение документа',doc.number+' · редакция '+doc.versions.length);
  if(persist()){
    toast('Сохранено: '+doc.number+' · редакция '+doc.versions.length);
    renderDoc(type);refreshIf('registry','home');
    if(typeof unlockAchievement==='function'){unlockAchievement('first_doc');if(state.docs.length>=10)unlockAchievement('ten_docs')}
  }
}

  return [d.org,DOCS[type].title,'№ '+(d.number||'проект')+' · '+niceDate(d.date),d.city,d.subject,d.recipient&&'Адресат: '+d.recipient,d.basis&&'Основание: '+d.basis,d.participants&&'Участники: '+d.participants,d.fromOrder&&'Из приказа: '+d.fromOrder,'',d.body,'',d.decision,'',d.position+' / '+d.author].filter(x=>x!==false&&x!==undefined).join('\n');
}

function stockMove(id,type){
  const x=state.stock.find(x=>x.id===id);if(!x)return;
  if(type==='reserve'){
    formDialog('Резерв · '+x.name,'<p>Остаток: <b>'+x.qty+' '+E(x.unit)+'</b></p>'
      +field('qty','Количество в резерв *','1','number')
      +field('reason','Причина резерва','Под операцию','text')
      +field('person','Кто зарезервировал',state.profile.name),d=>{
      const n=Number(d.qty);
      if(!finiteAmount(n)||n<=0)return toast('Введите корректное количество.',true);
      if(n>Number(x.qty))return toast('Недостаточно имущества для резерва.',true);
      x.reserved=(Number(x.reserved)||0)+n;
      state.moves.unshift({id:uid(),itemId:id,name:x.name,unit:x.unit,qty:-n,type:'Резерв',date:dateISO(),person:d.person,reason:d.reason,reserved:true});
      audit('Резерв',x.name+' · '+n);
      if(persist()){closeModal();stockRows();refreshIf('home')}
    });
    return;
  }
  const name={in:'Приход',out:'Расход',inv:'Инвентаризация'}[type];
  formDialog(name+' · '+x.name,'<p>Текущий остаток: <b>'+x.qty+' '+E(x.unit)+'</b></p>'+field('qty',type==='inv'?'Фактическое наличие':'Количество *',type==='inv'?x.qty:'1','number')+field('date','Дата',dateISO(),'date')+field('person','Выдал / принял / проверил',state.profile.name)+field('reason','Основание / примечание','','textarea'),d=>{
    const n=Number(d.qty),old=Number(x.qty);
    if(d.qty.trim()===''||!finiteAmount(n)||(type!=='inv'&&n<=0))return toast('Введите корректное количество.',true);
    if(type==='out'&&n>old)return toast('Недостаточно имущества: доступно '+old+' '+x.unit,true);
    const delta=type==='in'?n:type==='out'?-n:Math.round((n-old)*1e6)/1e6;
    const next=Math.round((old+delta)*1e6)/1e6;
    if(!finiteAmount(next))return toast('Остаток выходит за допустимые пределы.',true);
    x.qty=next;
    state.moves.unshift({id:uid(),itemId:id,name:x.name,unit:x.unit,qty:delta,type:name,date:d.date||dateISO(),person:d.person,reason:d.reason+(type==='inv'?' · было '+old+', факт '+n:'')});
    audit(name,x.name+' · '+delta+' '+x.unit);
    if(persist()){
      closeModal();stockRows();refreshIf('home');
      if(type==='inv')toast('Сверка сохранена. Расхождение: '+delta+' '+x.unit);
      if(typeof unlockAchievement==='function')unlockAchievement('first_stock');
    }
  });
}

function toTrash(source,id){
  if(!['docs','requests','shifts','contacts','tasks','events','messages','templates','stock'].includes(source))return;
  const index=state[source].findIndex(x=>x.id===id);if(index<0)return;
  const proceed=()=>{
    const item=state[source].splice(index,1)[0];
    state.trash.unshift({id:uid(),source,item,deleted:new Date().toISOString()});
    audit('Перемещение в корзину',item.title||item.name||item.number||source);
    if(source==='tasks'&&noteId===id){noteId=null;clearTimeout(noteTimer)}
    if(source==='docs')Object.keys(DOCS).forEach(k=>{if(state.drafts[k]?.id===id)state.drafts[k]={...state.drafts[k],id:null,number:''}});
    persist();refreshIf('trash','registry','requests','shifts','contacts','notes','schedule','chat','templates','home','stock');
  };
  ask('Переместить в корзину?','Запись можно будет восстановить из корзины.',proceed);
}

  toast('Резервная копия подготовлена.');
}
function pickJSON(fn){
  const input=document.createElement('input');
  input.type='file';input.accept='.json,application/json';
  input.onchange=async()=>{
    const f=input.files?.[0];if(!f)return;
    try{
      if(f.size>12*1024*1024)throw Error('Максимальный размер файла — 12 МБ');
      const data=JSON.parse(await f.text());
      await fn(data);
    }catch(e){toast('Импорт не выполнен: '+e.message,true)}
  };
  input.click();
}
function importBackup(){
  pickJSON(data=>{
    const clean=validState(data);
    const count=clean.docs.length+clean.requests.length+clean.tasks.length+clean.stock.length;
    ask('Восстановить резервную копию?','Найдено '+count+' документов, заявок, задач и позиций склада. Текущая база будет заменена.',()=>{
      try{localStorage.setItem(KEY,JSON.stringify(clean))}
      catch(e){return toast('Недостаточно места. Текущая база не изменена.',true)}
      closeModal();location.reload();
    });
  });
}

let mapData={markers:[],zones:[],routes:[],alarm:false,gridVisible:true,background:null};
let mapSelected=null,mapMode=null,mapTempPath=null,mapMeasure=null,mapBgImage=null;
function mapLoad(){
  try{
    const v=JSON.parse(localStorage.getItem('msvs7_map')||'null');
    if(v){
      if(Array.isArray(v.markers))mapData.markers=v.markers;
      if(Array.isArray(v.zones))mapData.zones=v.zones;
      if(Array.isArray(v.routes))mapData.routes=v.routes;
      if(v.background)mapData.background=v.background;
    }
  }catch(e){}
  mapBgImage=new Image();
  mapBgImage.onload=()=>drawMap();
  mapBgImage.src=mapData.background||mapGenerateBackground();
}
function mapGenerateBackground(){
  const c=document.createElement('canvas');c.width=1200;c.height=800;
  const x=c.getContext('2d');
  x.fillStyle='#2a4a2a';x.fillRect(0,0,1200,800);
  x.fillStyle='#1e3a1e';
  for(let i=0;i<60;i++){const cx=Math.random()*1200,cy=Math.random()*800,r=20+Math.random()*60;x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.fill()}
  x.strokeStyle='#1a4a7a';x.lineWidth=18;x.lineCap='round';
  x.beginPath();x.moveTo(0,300);x.bezierCurveTo(300,250,500,500,800,450);x.bezierCurveTo(1000,400,1100,550,1200,500);x.stroke();
  x.strokeStyle='#8a7a5a';x.lineWidth=6;
  x.beginPath();x.moveTo(100,100);x.lineTo(1100,700);x.stroke();
  x.beginPath();x.moveTo(200,700);x.lineTo(900,100);x.stroke();
  x.fillStyle='#a08060';x.strokeStyle='#000';x.lineWidth=1;
  [[300,200],[700,350],[950,600],[150,550]].forEach(([px,py])=>{x.fillRect(px-15,py-10,30,20);x.strokeRect(px-15,py-10,30,20)});
  return c.toDataURL('image/png');
}
function mapSave(){localStorage.setItem('msvs7_map',JSON.stringify(mapData))}
function renderMap(){
  setContent('map',banner('map','Посты, патрули, зоны и заметки на схеме 1200×800. Данные локальные.')
    +'<div class="toolbar">'
    +button('mapadd','+ Пост')+button('mapaddpatrol','+ Патруль')+button('mapaddnote','+ Заметка')+button('mapzone','+ Зона')
    +'<span style="border-left:1px solid #808080;height:20px;margin:0 4px"></span>'
    +button('mapalarm','⚠ Тревога')+button('mapgrid','Сетка')+button('mapmeasure','📏 Линейка')
    +'<span style="border-left:1px solid #808080;height:20px;margin:0 4px"></span>'
    +button('mapexportjson','JSON')+button('mapkml','KML')+button('mappng','PNG')+button('mapclear','Очистить','class="danger"')
    +'</div>'
    +'<div class="map-wrap">'
    +'<div class="map-canvas-wrap inset" style="flex:1;overflow:auto"><canvas id="mapCanvas" width="1200" height="800" style="display:block;width:100%;height:auto;cursor:crosshair;background:#2a4a2a"></canvas></div>'
    +'<div class="map-panel" id="mapPanel"><div class="map-legend">ЛЕГЕНДА</div>'
    +'<div>● <span style="color:#ffd700">Пост</span> · ▲ <span style="color:#00bfff">Патруль</span></div>'
    +'<div>■ <span style="color:#ff69b4">Заметка</span> · ◯ радиус</div>'
    +'<div>▭ <span style="color:#00ff00">Зона</span></div>'
    +'<div style="margin-top:8px;border-top:1px solid #0f0;padding-top:4px" id="mapInfo">Маркеров: 0</div>'
    +'</div></div>');
  const canvas=$('#mapCanvas');if(!canvas)return;
  canvas.onclick=e=>mapCanvasClick(e,canvas);
  canvas.oncontextmenu=e=>{e.preventDefault();mapCanvasRightClick(e,canvas)};
  if(!mapBgImage)mapLoad();
  drawMap();
}
function drawMap(){
  const canvas=$('#mapCanvas');if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;
  if(mapBgImage&&mapBgImage.complete){ctx.drawImage(mapBgImage,0,0,W,H)}
  else{ctx.fillStyle=mapData.alarm?'#3a1a1a':'#2a4a2a';ctx.fillRect(0,0,W,H)}
  if(mapData.gridVisible){
    ctx.strokeStyle=mapData.alarm?'rgba(255,100,100,0.15)':'rgba(0,255,0,0.12)';ctx.lineWidth=1;
    for(let x=0;x<W;x+=100){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
    for(let y=0;y<H;y+=100){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  }
  mapData.zones.forEach(z=>{
    if(!z.points||z.points.length<3)return;
    ctx.fillStyle=z.color+'44';ctx.strokeStyle=z.color;ctx.lineWidth=2;
    ctx.beginPath();z.points.forEach((p,i)=>{i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)});
    ctx.closePath();ctx.fill();ctx.stroke();
    if(z.name){const cx=z.points.reduce((s,p)=>s+p.x,0)/z.points.length,cy=z.points.reduce((s,p)=>s+p.y,0)/z.points.length;ctx.fillStyle=z.color;ctx.font='bold 11px Tahoma';ctx.textAlign='center';ctx.fillText(z.name,cx,cy)}
  });
  mapData.routes.forEach(r=>{
    if(!r.path||r.path.length<2)return;
    ctx.strokeStyle=r.type==='foot'?'#00bfff':'#00ff88';ctx.lineWidth=4;
    if(r.type==='foot')ctx.setLineDash([8,6]);else ctx.setLineDash([]);
    ctx.beginPath();r.path.forEach((p,i)=>{i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)});ctx.stroke();
    ctx.setLineDash([]);
    r.path.forEach(p=>{ctx.fillStyle='#ff0';ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.stroke()});
  });
  mapData.markers.forEach((m,i)=>{
    const sel=i===mapSelected;
    if(m.radius>0){ctx.fillStyle=mapData.alarm?'#ff000022':'#00ff0022';ctx.strokeStyle=mapData.alarm?'#ff0000':'#00ff00';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(m.x,m.y,m.radius,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.setLineDash([])}
    if(m.type==='post'){ctx.fillStyle=mapData.alarm?'#ff4444':'#ffd700';ctx.beginPath();ctx.arc(m.x,m.y,10,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.stroke()}
    else if(m.type==='patrol'){ctx.fillStyle=mapData.alarm?'#ff4444':'#00bfff';ctx.beginPath();ctx.moveTo(m.x,m.y-10);ctx.lineTo(m.x+10,m.y+10);ctx.lineTo(m.x-10,m.y+10);ctx.closePath();ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.stroke()}
    else{ctx.fillStyle=mapData.alarm?'#ff4444':'#ff69b4';ctx.fillRect(m.x-8,m.y-8,16,16);ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.strokeRect(m.x-8,m.y-8,16,16)}
    const dc={low:'#0f0',medium:'#ff0',high:'#f00'}[m.danger||'low'];
    ctx.fillStyle=dc;ctx.beginPath();ctx.arc(m.x+14,m.y-14,4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.stroke();
    if(sel){ctx.strokeStyle='#ffff00';ctx.lineWidth=2;ctx.beginPath();ctx.arc(m.x,m.y,14,0,Math.PI*2);ctx.stroke()}
    ctx.fillStyle='#fff';ctx.font='bold 10px Tahoma';ctx.textAlign='center';ctx.fillText(String(m.name||'').slice(0,14),m.x,m.y+24);
  });
  if(mapTempPath&&mapTempPath.length){
    ctx.strokeStyle='#ff0';ctx.lineWidth=3;ctx.setLineDash([6,4]);
    ctx.beginPath();mapTempPath.forEach((p,i)=>{i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)});ctx.stroke();ctx.setLineDash([]);
    mapTempPath.forEach(p=>{ctx.fillStyle='#ff0';ctx.beginPath();ctx.arc(p.x,p.y,6,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#000';ctx.stroke()});
  }
  if(mapMeasure&&mapMeasure.a&&mapMeasure.b){
    ctx.strokeStyle='#ff0';ctx.lineWidth=2;ctx.setLineDash([5,5]);
    ctx.beginPath();ctx.moveTo(mapMeasure.a.x,mapMeasure.a.y);ctx.lineTo(mapMeasure.b.x,mapMeasure.b.y);ctx.stroke();ctx.setLineDash([]);
    const dist=Math.hypot(mapMeasure.b.x-mapMeasure.a.x,mapMeasure.b.y-mapMeasure.a.y);
    ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fillRect((mapMeasure.a.x+mapMeasure.b.x)/2-30,(mapMeasure.a.y+mapMeasure.b.y)/2-12,60,20);
    ctx.fillStyle='#ff0';ctx.font='bold 11px monospace';ctx.textAlign='center';ctx.fillText((dist/100).toFixed(2)+' км',(mapMeasure.a.x+mapMeasure.b.x)/2,(mapMeasure.a.y+mapMeasure.b.y)/2+4);
  }
  ctx.fillStyle=mapData.alarm?'#ff0000':'#8b0000';ctx.font='bold 14px monospace';ctx.textAlign='left';ctx.fillText(mapData.alarm?'⚠ ТРЕВОГА ⚠':'СХЕМА',8,18);
  ctx.fillStyle='#0f0';ctx.font='9px monospace';ctx.fillText('X: 0–'+W,8,H-4);ctx.fillText('Y: 0–'+H,W-70,H-4);
  const info=$('#mapInfo');
  if(info){
    let html='Маркеров: <b>'+mapData.markers.length+'</b><br>Маршрутов: <b>'+mapData.routes.length+'</b><br>Зон: <b>'+mapData.zones.length+'</b>';
    if(mapSelected!==null){
      const m=mapData.markers[mapSelected];
      if(m){
        html+='<br><br><b style="color:#ffd700">'+E(m.name)+'</b>';
        if(m.desc)html+='<br><span style="color:#888">'+E(m.desc)+'</span>';
        if(m.commander)html+='<br><span style="color:#0f0">Командир: '+E(m.commander)+'</span>';
        if(m.callsign)html+='<br><span style="color:#0f0">Позывной: '+E(m.callsign)+'</span>';
        if(m.count)html+='<br><span>Людей: '+m.count+'</span>';
        html+='<br><br><select id="mapSelStatus">';
        ['ready','warning','danger'].forEach(s=>{html+='<option value="'+s+'"'+(m.status===s?' selected':'')+'>'+({ready:'🟢 Готов',warning:'🟡 Внимание',danger:'🔴 Опасность'}[s])+'</option>'});
        html+='</select>';
        html+='<br><br><button data-action="mapdelete" data-id="'+E(m.id)+'">Удалить</button>';
      }
    }
    info.innerHTML=html;
    const sel=$('#mapSelStatus');
    if(sel)sel.onchange=()=>{const m=mapData.markers[mapSelected];if(m){m.status=sel.value;mapSave();drawMap()}};
  }
}
function mapCanvasClick(e,canvas){
  const rect=canvas.getBoundingClientRect();
  const x=Math.round((e.clientX-rect.left)/rect.width*canvas.width/10)*10;
  const y=Math.round((e.clientY-rect.top)/rect.height*canvas.height/10)*10;
  if(mapMeasure){
    if(!mapMeasure.a)mapMeasure.a={x,y};
    else if(!mapMeasure.b){mapMeasure.b={x,y};toast('Расстояние: '+(Math.hypot(mapMeasure.b.x-mapMeasure.a.x,mapMeasure.b.y-mapMeasure.a.y)/100).toFixed(2)+' км')}
    else{mapMeasure={a:{x,y},b:null}}
    drawMap();return;
  }
  if(mapMode==='patrol'&&mapTempPath){
    mapTempPath.push({x,y});
    drawMap();return;
  }
  for(let i=0;i<mapData.markers.length;i++){
    const m=mapData.markers[i];
    if(Math.hypot(m.x-x,m.y-y)<18){mapSelected=(mapSelected===i)?null:i;drawMap();return}
  }
  mapSelected=null;
  drawMap();
}
function mapCanvasRightClick(e,canvas){
  const rect=canvas.getBoundingClientRect();
  const x=Math.round((e.clientX-rect.left)/rect.width*canvas.width/10)*10;
  const y=Math.round((e.clientY-rect.top)/rect.height*canvas.height/10)*10;
  contextMenu(e.clientX,e.clientY,[
    ['mapquickpost','Пост здесь','data-x="'+x+'" data-y="'+y+'"'],
    ['mapquickpatrol','Патруль здесь','data-x="'+x+'" data-y="'+y+'"'],
    ['mapquicknote','Заметка здесь','data-x="'+x+'" data-y="'+y+'"']
  ]);
}
