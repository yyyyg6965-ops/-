<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000080">
<title>МСВС 1.0 — BETA · Объединённая версия</title>
<style>
/* ... (стили из MSVS_CORE_updated.html остаются практически без изменений, они хороши) ... */
:root{--w95-face:#c0c0c0;--w95-light:#fff;--w95-shadow:#808080;--w95-dark:#000;--w95-text:#000;--w95-disabled:#808080;--w95-accent:#000080;--w95-accent2:#1084d0;--w95-field:#fff;--w95-field-text:#000;--w95-btn-face:#c0c0c0;--w95-tooltip:#ffffe1;--w95-desk:#008080;--w95-out:2px solid;--w95-out-c:#fff #808080 #808080 #fff;--w95-in:2px solid;--w95-in-c:#808080 #fff #fff #808080;--w95-font:'MS Sans Serif',Tahoma,Arial,sans-serif;--w95-doc:'Times New Roman',serif}
*{box-sizing:border-box;border-radius:0!important;transition:none!important}
html,body{margin:0;height:100%;overflow:hidden}
body{font:11px var(--w95-font);color:var(--w95-text);background:var(--w95-desk);-webkit-font-smoothing:none}
button,input,select,textarea{font:11px var(--w95-font)}
button{color:var(--w95-text);background:var(--w95-btn-face);border:var(--w95-out);border-color:var(--w95-out-c);padding:3px 8px;cursor:pointer;min-height:23px}
button:active{border-color:var(--w95-in-c);padding:4px 7px 2px 9px}
button:focus-visible{outline:1px dotted #000;outline-offset:-4px}
button:disabled{color:var(--w95-disabled);text-shadow:1px 1px 0 #fff;cursor:default}
input,select,textarea{border:var(--w95-in);border-color:var(--w95-in-c);background:var(--w95-field);color:var(--w95-field-text);padding:2px 4px;min-width:0}
input:focus,select:focus,textarea:focus{outline:1px dotted #000;outline-offset:-3px}
textarea{resize:vertical;min-height:80px;line-height:1.4}
label{display:flex;flex-direction:column;gap:2px}
svg.ico{width:32px;height:32px;flex-shrink:0;image-rendering:pixelated}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:#555;font-size:10px;line-height:1.4}
.raised{border:var(--w95-out);border-color:var(--w95-out-c)}
.inset{border:var(--w95-in);border-color:var(--w95-in-c)}
.notice{background:var(--w95-tooltip);border:1px solid #000;padding:8px;line-height:1.4;font-size:10px}
.section-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#555;margin:14px 0 6px}
.hr{height:2px;background:var(--w95-shadow);border-bottom:1px solid #fff;margin:8px 0}
.empty{padding:25px 12px;text-align:center;color:#666;line-height:1.5}
.tag{font-size:9px;border:1px solid #999;background:#eee;padding:2px 4px;display:inline-block;white-space:nowrap}
.tag.warn{background:#fff4bd;color:#684500}
.tag.ok{background:#deefda;color:#175121}
.danger{color:#800000}
.primary{font-weight:bold;outline:1px dotted #000;outline-offset:-3px}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field-grid .full{grid-column:1/-1}
h1,h2,h3,p{margin:0 0 8px}
h2{font-size:17px}h3{font-size:12px}
fieldset{border:2px groove #fff;margin:0 0 10px;padding:8px}
legend{font-size:10px;padding:0 4px;font-weight:bold}
#desktop{position:absolute;inset:0 0 32px;overflow:hidden;background:var(--w95-desk)}
#desktop.dusk{background:linear-gradient(#203756,#416b75)}
#desktop.night{background:linear-gradient(#0c2139,#164e56)}
#desktop.morning{background:linear-gradient(#497e93,#79b2a1)}
#desktop.day{background:linear-gradient(#1d7e8c,#398c79)}
#icons{position:absolute;inset:8px;pointer-events:none;overflow:hidden}
.shortcut{position:absolute;width:76px;min-height:72px;border:1px solid transparent;background:transparent!important;color:#fff;text-shadow:1px 1px #000;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:auto;touch-action:none;line-height:1.2;font-size:10px}
.shortcut.selected,.shortcut:focus-visible{background:#00008066!important;border:1px dotted #fff!important;outline:none}
.shortcut:hover{background:#ffffff13!important}
.shortcut .ico{width:32px;height:32px}
#deskmark{position:absolute;right:20px;bottom:20px;color:#ffffff55;pointer-events:none;text-align:right}
.deskword{font:bold 42px Arial;letter-spacing:-3px}
.deskversion{font:10px Tahoma;letter-spacing:3px;margin-top:2px}
.window{position:absolute;display:flex;flex-direction:column;background:var(--w95-face);border:var(--w95-out);border-color:var(--w95-out-c);padding:2px;box-shadow:1px 1px 0 #000;min-width:300px;min-height:200px;max-width:100%;max-height:100%;overflow:hidden}
.window.focused{box-shadow:2px 2px 0 #000}
.window.hidden{display:none}
.window.max{left:0!important;top:0!important;width:100%!important;height:100%!important}
.titlebar{height:22px;min-height:22px;display:flex;align-items:center;gap:4px;background:var(--w95-accent);color:#fff;padding:2px 2px 2px 4px;user-select:none;touch-action:none;font-weight:bold}
.window:not(.focused)>.titlebar{background:#808080}
.titlebar .ico{width:16px;height:16px}
.wtitle{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
.controls{display:flex;gap:1px}
.controls button{padding:0;width:16px;height:14px;min-height:0;line-height:10px;font:bold 10px Tahoma}
.menubar{padding:2px 2px;display:flex;gap:2px;border-bottom:1px solid #808080;flex-wrap:wrap}
.menubar button{border:0;background:transparent;min-height:20px;padding:2px 6px;font-size:10px}
.menubar button:hover{background:var(--w95-accent);color:#fff}
.content{flex:1;min-height:0;overflow:auto;padding:8px}
.status{display:flex;gap:2px;margin-top:2px;flex-shrink:0;font-size:10px}
.status span{padding:2px 6px;border:1px solid;border-color:#808080 #fff #fff #808080;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.status span:first-child{flex:1}
.banner{display:flex;align-items:center;gap:10px;border-bottom:2px groove #fff;padding:4px 2px 10px;margin-bottom:10px}
.banner .ico{width:36px;height:36px}
.banner p{font-size:10px;color:#555;margin:2px 0 0;line-height:1.4}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.tile{display:flex;align-items:flex-start;text-align:left;gap:8px;padding:8px 6px;min-height:64px}
.tile b{display:block;margin:1px 0 3px;font-size:11px}
.tile small{display:block;font-size:9px;line-height:1.3;color:#555;font-weight:normal}
.tile:hover{background:#d0d0d0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.stat{padding:8px}
.stat strong{font:18px 'Courier New';display:block;color:var(--w95-accent);margin-bottom:3px}
.stat small{font-size:9px;color:#555}
.split{display:grid;grid-template-columns:minmax(220px,.85fr) minmax(300px,1.3fr);gap:8px;height:100%;min-height:0}
.form-scroll{overflow:auto;padding:2px 4px 6px 2px;min-height:0}
.preview-wrap{display:flex;flex-direction:column;min-width:0;min-height:0;background:#808080}
.preview-tools{padding:4px;background:var(--w95-face);display:flex;align-items:center;justify-content:space-between;gap:4px;font-size:9px}
.paper-scroll{flex:1;min-height:0;overflow:auto;padding:10px}
.paper{width:210mm;min-height:297mm;padding:20mm 15mm 20mm 25mm;background:#fff;color:#000;box-shadow:1px 1px 0 #555;font:13px/1.5 var(--w95-doc);user-select:text;overflow-wrap:anywhere;position:relative}
.paper h1{text-align:center;font-size:18px;letter-spacing:2px;margin:20px 0 6px}
.paper h2{text-align:center;font-size:14px;margin:6px 0 20px}
.paper .meta{display:flex;justify-content:space-between;margin:15px 0}
.paper .address{text-align:right;white-space:pre-wrap;margin-bottom:25px}
.paper .body{white-space:pre-wrap;text-align:justify;margin:12px 0}
.paper .signature{margin-top:30px;display:flex;justify-content:space-between;gap:10px;align-items:end}
.paper .sig-img{width:120px;max-height:50px;object-fit:contain}
.paper .footnote{font:8px/1.3 Arial;color:#777;margin-top:30px;border-top:1px solid #aaa;padding-top:6px}
.paper .incoming-stamp{position:absolute;top:20mm;left:20mm;border:1px dashed #999;width:50mm;height:25mm;font:9px Arial;color:#999;display:flex;align-items:center;justify-content:center;text-align:center}
.table-wrap{overflow:auto;background:#fff;min-height:80px}
.data{border-collapse:collapse;width:100%;font-size:10px}
.data th{text-align:left;background:var(--w95-face);position:sticky;top:0;z-index:1;border:1px solid #808080;padding:4px;white-space:nowrap}
.data td{padding:4px;border-bottom:1px solid #ddd;vertical-align:top;overflow-wrap:anywhere;max-width:300px}
.data tbody tr:hover{background:#efeffa}
.data td button{padding:1px 4px;min-height:19px;font-size:9px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-bottom:8px}
.toolbar input{flex:1;min-width:80px}
.toolbar select{max-width:150px}
.listitem{background:#fff;border:1px solid #999;padding:8px;margin-bottom:6px;line-height:1.4}
.listitem .text{white-space:pre-wrap;margin:6px 0}
.listitem small{font-size:9px;color:#555}
.listitem .row{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.two-panel{display:grid;grid-template-columns:280px 1fr;gap:8px}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note-layout{display:grid;grid-template-columns:200px 1fr;gap:8px;height:100%}
.notelist{overflow:auto;background:#fff;padding:2px}
.notelist button{border:0;background:#fff;width:100%;display:block;text-align:left;padding:6px;font-size:10px}
.notelist button.current{background:var(--w95-accent);color:#fff}
.notelist small{display:block;color:inherit;opacity:.7;margin-top:2px}
.chat{display:flex;flex-direction:column;height:100%;gap:6px}
.messages{overflow:auto;flex:1;background:#fff;padding:8px}
.bubble{max-width:85%;background:#eee;border:1px solid #aaa;padding:6px;margin:0 0 6px;white-space:pre-wrap;line-height:1.4}
.bubble.mine{margin-left:auto;background:#eef0ff}
.bubble small{font-size:9px;color:#555;display:block;margin-bottom:3px}
.bubble blockquote{margin:2px 0;padding:3px 6px;border-left:2px solid #808080;background:#fff;font-size:10px}
.chat-entry{display:flex;gap:4px}
.chat-entry textarea{flex:1;min-height:50px;height:50px}
#taskbar{position:absolute;bottom:0;left:0;right:0;height:32px;background:var(--w95-face);border-top:2px solid #fff;z-index:15000;display:flex;align-items:center;gap:3px;padding:2px}
.startbtn{height:24px;font-weight:bold;font-size:11px;display:flex;gap:3px;align-items:center;padding:1px 5px}
.startbtn .ico{width:18px;height:18px}
#tasks{display:flex;gap:2px;flex:1;min-width:0;overflow:auto}
.task{min-width:60px;max-width:140px;flex:1;height:23px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:3px;align-items:center;text-align:left;font-size:10px;padding:1px 4px}
.task .ico{width:14px;height:14px}
.task.active{background:#e8e8e0;font-weight:bold;border-color:#000 #fff #fff #000}
.tray{height:23px;display:flex;align-items:center;gap:6px;border:var(--w95-in);border-color:var(--w95-in-c);padding:1px 6px;font-size:10px}
.tray button{border:0;min-height:18px;padding:0;font-size:10px}
.showdesk{width:12px;padding:0;min-width:12px;height:23px}
#start{position:fixed;bottom:32px;left:2px;z-index:15001;width:290px;max-height:calc(100dvh - 40px);display:none;background:var(--w95-face);border:var(--w95-out);border-color:var(--w95-out-c);padding:2px;box-shadow:1px 1px 0 #000}
#start.open{display:flex}
.startside{width:26px;background:#808080;writing-mode:vertical-rl;transform:rotate(180deg);color:#ddd;font:bold 18px Arial;padding:6px 2px;letter-spacing:1px}
.startbody{flex:1;min-width:0;overflow:auto}
.startprofile{padding:8px 8px;border-bottom:2px groove white;display:flex;gap:6px;align-items:center;font-size:10px}
.startprofile .ico{width:22px;height:22px}
.startbody>button,.startbody details button{border:0;width:100%;display:flex;gap:6px;align-items:center;text-align:left;padding:4px 8px;min-height:28px;font-size:10px;background:transparent}
.startbody button .ico,.startbody summary .ico{width:20px;height:20px}
.startbody button:hover{background:var(--w95-accent);color:white}
.startbody details{position:relative}
.startbody summary{cursor:pointer;padding:5px 8px;display:flex;align-items:center;gap:6px;font-size:10px;list-style:none}
.startbody summary:after{content:'▸';margin-left:auto}
.startbody details[open] summary:after{content:'▾'}
.startbody details[open] summary{font-weight:bold}
.startbody details>div{margin:0 4px 4px 20px;border-left:1px solid #808080;padding-left:2px}
.startbody details button{min-height:24px;font-size:10px;padding:2px 6px}
.startbody details button .ico{width:16px;height:16px}
#context{position:fixed;display:none;z-index:20000;background:var(--w95-face);padding:2px;box-shadow:1px 1px 0 #000;border:var(--w95-out);border-color:var(--w95-out-c)}
#context button{display:block;border:0;text-align:left;width:100%;background:transparent;padding:4px 14px;font-size:10px}
#context button:hover{background:var(--w95-accent);color:white}
.overlay{position:fixed;inset:0;background:#0006;z-index:30000;display:none;align-items:center;justify-content:center;padding:8px}
.overlay.open{display:flex}
.dialog{width:520px;max-width:100%;max-height:90dvh;background:var(--w95-face);border:var(--w95-out);border-color:var(--w95-out-c);padding:2px;box-shadow:2px 2px 0 #000;display:flex;flex-direction:column}
.dialog>.titlebar{background:var(--w95-accent);cursor:default}
.dialog-body{padding:12px;overflow:auto}
.dialog-actions{padding:0 12px 10px;display:flex;justify-content:flex-end;gap:6px}
.dialog-actions button{min-width:70px}
.palette-results{background:#fff;padding:2px;max-height:50vh;overflow:auto;margin-top:8px}
.palette-results button{width:100%;display:flex;align-items:center;gap:8px;text-align:left;background:#fff;border:0;padding:6px}
.palette-results button:hover{background:var(--w95-accent);color:#fff}
#toast{position:fixed;bottom:40px;right:12px;max-width:320px;background:var(--w95-tooltip);border:1px solid #000;padding:8px 10px;z-index:40000;display:none;font-size:10px;line-height:1.4;box-shadow:1px 1px 0 #000}
#toast.error{background:#ffe2da}
.boot{position:fixed;inset:0;z-index:50000;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#ccc;font-family:'Courier New',monospace;font-size:12px}
.bootbox{width:440px;background:#000;padding:24px;border:1px solid #1a3a1a;box-shadow:0 0 40px rgba(0,255,0,.08)}
.progress{height:16px;padding:1px;border:2px inset #fff;overflow:hidden;background:#000;margin-top:10px}
.progress div{height:100%;width:0;background:linear-gradient(90deg,#0f0,#7f7);animation:boot 1.6s steps(20) forwards}
@keyframes boot{to{width:100%}}
.bootlog{white-space:pre-wrap;margin-top:10px;color:#0f0;font-size:10px;max-height:140px;overflow:auto}
#lock{background:var(--w95-desk);z-index:60000}
#print{display:none}
.mines{display:grid;gap:0;background:#c0c0c0;width:max-content;margin:10px auto;padding:3px}
.mines button{width:24px;height:24px;min-height:0;padding:0;font:bold 12px monospace}
.mines button.opened{border:1px solid #999;background:#c0c0c0}
.mines button.exploded{background:#f77}
.led{font:22px monospace;background:#150000;color:#f33;border:2px inset white;padding:1px 4px}
.calc-display{font:24px monospace;text-align:right;padding:6px;width:100%;background:#fff;margin-bottom:6px;overflow:hidden}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.calc-grid button{min-height:34px;font-size:14px}
.media-screen{min-height:140px;background:#101014;display:flex;align-items:center;justify-content:center;color:#52dba8;position:relative;border:2px inset #fff}
.media-screen video{width:100%;max-height:220px}
.media-screen span{position:absolute;pointer-events:none;font:18px monospace}
.media-list{height:110px;overflow:auto;background:#fff;padding:2px;margin:6px 0}
.media-list button{display:block;text-align:left;width:100%;border:0;background:#fff;font-size:10px}
.media-list button.chosen{background:var(--w95-accent);color:#fff}
.map-wrap{display:flex;gap:8px;align-items:flex-start}
.map-canvas-wrap{flex:1;background:#1a3a1a;min-width:300px;overflow:auto}
.map-panel{width:240px;background:#1a1a1a;color:#0f0;padding:8px;font:10px 'Courier New';border:2px inset #fff;max-height:600px;overflow:auto}
.map-panel select,.map-panel input{background:#0a1a0a;color:#0f0;border:1px solid #0f0;font-size:10px;width:100%;padding:2px}
.map-panel button{background:#003300;color:#0f0;border:1px solid #0f0;font-size:10px;width:100%}
.map-legend{font-weight:bold;border-bottom:1px solid #0f0;padding-bottom:4px;margin-bottom:4px}
body.crt::after{content:"";position:fixed;inset:0;background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,0.15) 2px 3px);pointer-events:none;z-index:65000}
body.crt::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,0.3) 100%);pointer-events:none;z-index:64999}
::-webkit-scrollbar{width:16px;height:16px}
::-webkit-scrollbar-track{background:#c0c0c0;border-left:1px solid #808080}
::-webkit-scrollbar-thumb{background:#c0c0c0;border:2px solid;border-color:#fff #808080 #808080 #fff}
::-webkit-scrollbar-button{background:#c0c0c0;border:2px solid;border-color:#fff #808080 #808080 #fff;display:block;height:16px}
@media(max-width:800px){
  .window{left:2px!important;top:2px!important;width:calc(100% - 4px)!important;height:calc(100% - 4px)!important;min-width:0}
  .split{grid-template-columns:1fr;height:auto}
  .form-scroll{overflow:visible}
  .preview-wrap{min-height:400px;max-height:600px}
  .settings-grid,.two-panel{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .note-layout{grid-template-columns:1fr;height:auto}
  .notelist{max-height:120px}
  .tray .local-label{display:none}
  .task{min-width:40px;font-size:9px}
  #deskmark{display:none}
  .shortcut{width:70px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile{padding:6px;gap:5px}
  .tile .ico{width:22px;height:22px}
  #start{width:min(290px,95vw)}
  .field-grid{grid-template-columns:1fr}
  .field-grid .full{grid-column:auto}
  .content{padding:6px}
  .map-wrap{flex-direction:column}
  .map-panel{width:100%;max-height:300px}
}
@media print{
  @page{size:A4;margin:10mm}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  body>*{display:none!important}
  #print{display:block!important}
  #print .paper{width:auto!important;min-height:0!important;padding:0!important;box-shadow:none!important;margin:0!important}
  #print .page{break-after:page}
  #print .page:last-child{break-after:auto}
}
#holidayBanner{background:linear-gradient(90deg,#800000,#c00000);color:#fff;padding:6px 10px;font-size:10px;display:flex;align-items:center;gap:8px;border:1px solid #500;margin-bottom:8px;box-shadow:inset 0 0 12px rgba(0,0,0,.3)}
#holidayBanner .star{font-size:18px}
.holiday-list .holiday{display:flex;gap:8px;padding:6px;border-bottom:1px solid #ddd;font-size:11px}
.holiday-list .holiday .date{width:80px;font-weight:bold;color:#800000}
.holiday-list .holiday.federal .date::after{content:" ★";color:#c00}
#authScreen{position:fixed;inset:0;background:linear-gradient(135deg,#000080,#1084d0);z-index:61000;display:none;align-items:center;justify-content:center;padding:8px}
#authScreen .dialog{width:460px}
.boot-star{display:block;margin:0 auto 8px}
.role-badge{display:inline-block;font-size:9px;padding:1px 5px;border-radius:3px;margin-left:4px}
.role-soldier{background:#dde;color:#008}
.role-officer{background:#dfe8d0;color:#264}
.role-commander{background:#ffd;color:#800}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.ach{background:#fff;border:2px solid #808080;padding:8px;text-align:center;font-size:10px}
.ach.locked{opacity:.45;filter:grayscale(1)}
.ach .ach-ico{font-size:28px}
</style>
</head>
<body>

<div id="desktop"><div id="icons"></div><div id="deskmark"><div class="deskword">МСВС</div><div class="deskversion">1.0 · BETA</div><p style="font-size:9px;margin-top:8px">ВС РФ · Объединённая версия</p></div><div id="windows"></div></div>

<div id="taskbar">
  <button class="startbtn" id="startButton" aria-expanded="false"></button>
  <div style="border-left:1px solid #808080;border-right:1px solid white;height:20px"></div>

'use strict';

/* === КОНСТАНТЫ === */
const KEY='msvs7_core';
const $=(s,r=document)=>r.querySelector(s);

const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const dateISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const niceDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')?s.split('-').reverse().join('.'):(s||'—');
const normalize=s=>String(s||'').toLocaleLowerCase('ru-RU');

/* === СОСТОЯНИЕ === */
const defaultState=()=>({
  schema:7,
  profile:{name:'',position:'',org:'',city:''},
  settings:{sound:true,crt:false,wall:'classic',accent:'#000080',restore:true,pin:'',autolock:0},
  docs:[],requests:[],shifts:[],stock:[],moves:[],contacts:[],tasks:[],events:[],messages:[],templates:[],trash:[],audit:[],
  drafts:{},seq:{},layout:{},icons:{},
  quizHistory:[],normsLog:[],flashcards:[],
  session:{failedLogins:0,lastLogin:0}
});
let state=defaultState();
let storageOK=true,saveTimer,dirty=false;

function validState(x){
  if(!x||x.schema!==7||typeof x!=='object')throw Error('Неизвестный формат базы');
  const out=defaultState();
  for(const k of ['docs','requests','shifts','stock','moves','contacts','tasks','events','messages','templates','trash','audit','quizHistory','normsLog','flashcards']){
    if(Array.isArray(x[k]))out[k]=x[k].filter(v=>v&&typeof v==='object'&&!Array.isArray(v)).slice(0,10000);
  }
  for(const k of ['profile','settings','drafts','seq','layout','icons','session']){
    if(x[k]&&typeof x[k]==='object'&&!Array.isArray(x[k]))out[k]=JSON.parse(JSON.stringify({...out[k],...x[k]}));
  }
  for(const k of ['name','position','org','city'])out.profile[k]=String(out.profile[k]||'').slice(0,300);
  if(!/^#[\da-f]{6}$/i.test(out.settings.accent))out.settings.accent='#000080';
  if(!['classic','auto'].includes(out.settings.wall))out.settings.wall='classic';
  for(const k of ['sound','crt','restore'])out.settings[k]=!!out.settings[k];
  out.settings.pin=typeof out.settings.pin==='string'&&/^[a-f0-9]{64}$/.test(out.settings.pin)?out.settings.pin:'';
  out.settings.autolock=Number.isFinite(out.settings.autolock)?Math.max(0,Math.min(120,Number(out.settings.autolock))):0;
  return out;
}
try{
  const raw=localStorage.getItem(KEY);
  if(raw)state=validState(JSON.parse(raw));
  localStorage.setItem(KEY+'_test','1');localStorage.removeItem(KEY+'_test');
}catch(e){storageOK=false}

function persist(silent=false){
  clearTimeout(saveTimer);
  try{
    localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;dirty=false;
    if(window.__fbUser && window.MSVS_FIREBASE) fbPushState().catch(()=>{});
    return true;
  }catch(e){
    storageOK=false;dirty=true;
    if(!silent)toast('Не удалось сохранить. Хранилище недоступно или заполнено.',true);
    return false;
  }
}
function queueSave(){dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(()=>persist(),450)}
function audit(action,details=''){
  state.audit.unshift({id:uid(),time:new Date().toISOString(),action,details:String(details).slice(0,300)});
  state.audit=state.audit.slice(0,500);
}
function download(name,text,type='text/plain;charset=utf-8'){
  const url=URL.createObjectURL(new Blob([text],{type}));
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
}
function cellCSV(v){let s=String(v??'');if(/^[\s]*[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function csv(name,rows){download(name,'\uFEFF'+rows.map(r=>r.map(cellCSV).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
function toast(text,error=false){
  const t=$('#toast');t.textContent=text;t.classList.toggle('error',error);t.style.display='block';
  clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',5000);
  if(error)sound('error');
}
let audio;
function sound(type='click'){
  if(!state.settings.sound)return;
  try{
    audio ||= new (window.AudioContext||window.webkitAudioContext)();
    audio.resume();
    const osc=audio.createOscillator(),gain=audio.createGain();
    osc.type='square';
    osc.frequency.setValueAtTime(type==='error'?180:type==='message'?880:type==='ok'?700:540,audio.currentTime);
    gain.gain.setValueAtTime(.025,audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.09);
    gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+.1);
  }catch(e){}
}

2.5.2. Порядок проведения развода:
1. Построение наряда — личный состав нового суточного наряда строится в развернутом строю в шеренги по направлениям батальонов
2. Проверка готовности — Начальник развода проходит по строю и проверяет наличие оружия, амуниции, экипировки, чистоту и опрятность обмундирования
3. Проверка документов — проверяется наличие нарядного листа у каждого нарядчика
4. Доклад — Начальник развода докладывает Дежурному по ГвВК: «Товарищ (звание и фамилия), суточный наряд в составе ___ человек к несению службы готов»
5. Инструктаж — Дежурный по ГвВК дает необходимые инструкции и указания
6. Отправка на посты — наряд отправляется на несение службы согласно расписанию

2.5.3. Смена постов производится согласно установленному времени:
- На постах охраны периметра — каждые 2 часа
- На посту КПП (командного пункта) — каждые 3 часа
- На наблюдательных постах — каждые 2 часа
- На постах разведки — согласно особому графику

2.5.4. При смене поста приходящий часовой обязан:
- Прибыть на пост точно в установленное время
- Проверить исправность оружия и оборудования
- Осмотреть пост и убедиться в целостности ограждения, освещения и связи
- Получить доклад от сменяемого часового о происходящих событиях и состоянии поста
- Расписаться в журнале смены постов

2.6. Организация освещения и безопасности

2.6.1. Периметр ГвВК освещается в ночное время в соответствии с техническими требованиями.

2.6.2. Ответственность за состояние освещения возлагается на начальника хозяйственной службы.

2.6.3. При отключении освещения немедленно докладывается Дежурному по ГвВК, принимаются меры по восстановлению освещения или усилению охраны.

2.7. Организация противопожарной безопасности

2.7.1. За противопожарную безопасность в ГвВК отвечает старший по пожарной охране, подчиняющийся Начальнику ГвВК.

2.7.2. В каждой роте назначается дежурный по пожарной охране, который ежедневно проверяет исправность огнетушителей и запасных выходов.

2.7.3. При возникновении пожара подается сигнал тревоги, немедленно вызывается пожарная служба и докладывается Дежурному по ГвВК.

Глава 3. ОРГАНИЗАЦИЯ И ВЕДЕНИЕ КАРАУЛЬНОЙ СЛУЖБЫ

3.1. Назначение и организация караульной службы

3.1.1. Караульная служба предназначена для:
- Охраны и обороны объектов и периметра ГвВК
- Предотвращения несанкционированного входа и выхода
- Защиты вооружения, техники и имущества
- Оказания сопротивления при попытке вооруженного нападения

3.1.2. Караулы выставляются на:
- Главные ворота и КПП (командный пункт пропуска)
- Склады вооружения и боеприпасов
- Помещения штаба
- Жилые казармы (при необходимости)
- Объекты водоснабжения, электроснабжения и связи

3.1.3. Численность караула определяется Начальником ГвВК в зависимости от важности охраняемого объекта и составляет:
- Минимум 3 человека (караульный, помощник и часовой)
- Максимум 10–15 человек (для особо важных объектов)

3.2. Состав и организация караула

3.2.1. Типовой состав караула:
Начальник караула — Сержант, старший сержант — 1
Помощник начальника — Младший сержант — 1
Часовой (смена 1) — Рядовой, младший сержант — 2–3
Часовой (смена 2) — Рядовой, младший сержант — 2–3
Разъездной — Рядовой — 1

3.2.2. На командных постах назначаются опытные сержанты и старшины, прошедшие специальную подготовку.

3.2.3. Караульное помещение должно иметь:
- Место для отдыха личного состава
- Оружейную тумбочку для хранения винтовок
- Столик для несения документов
- Рацию для связи с Дежурным по ГвВК
- Журнал учета смены постов и происходящих событий

3.3. Обязанности начальника караула

3.3.1. Начальник караула несет полную ответственность за боевое состояние, дисциплину и выполнение служебных обязанностей всеми членами караула.

3.3.2. Начальник караула обязан:
1. Организовать несение службы согласно приказу Дежурного по ГвВК
2. Проверить готовность всех членов караула к несению службы
3. Проверить наличие и исправность оружия, амуниции и оборудования
4. Проверить знание пароля, отзыва и кодов доступа
5. Организовать несение боевого поста согласно графику
6. Контролировать состояние охраняемого объекта
7. Ежечасно проверять часовых на постах
8. Вести журнал учета событий и происходящего на посту
9. Докладывать Дежурному по ГвВК о всех происходящих событиях
10. Организовать прием и сдачу караула согласно установленному регламенту

Запрещается начальнику караула:
- Оставлять пост без разрешения Дежурного по ГвВК
- Допускать хождение личного состава на пост без подготовки
- Нарушать регламент смены часовых
- Употреблять спиртные напитки и наркотические вещества

3.4. Обязанности часовых и членов караула

3.4.1. Часовой на посту обязан:
1. Стойко охранять и оборонять свой пост — это главная обязанность часового
2. Не оставлять пост без разрешения начальника караула
3. Проверять документы (пропуска, удостоверения личности) у всех лиц, проходящих через пост
4. Докладывать о всех происходящих событиях
5. Знать пароль и отзыв, утвержденные на день
6. Уметь пользоваться оружием и средствами связи
7. Соблюдать форму одежды и содержать себя в опрятном виде
8. Знать расписание смены постов и время явки приходящего часового
9. При смене поста передать необходимую информацию приходящему часовому
10. Не спать, не разговаривать без необходимости и не отвлекаться от службы

3.4.2. Помощник начальника караула обязан:
1. Заменять начальника караула в его отсутствие
2. Контролировать состояние оружия и оборудования
3. Организовать питание и отдых личного состава
4. Вести учет личного состава
5. Докладывать начальнику караула о всех происходящих событиях

3.4.3. Разъездной караула обязан:
1. Осуществлять патрулирование территории, прилегающей к посту
2. Проверять исправность ограждения и освещения
3. Ездить на лошади или передвигаться пешком согласно указаниям начальника караула
4. Своевременно докладывать об обнаруженных неисправностях и происшествиях

3.5. Пропускной и учетный режимы

3.5.1. На КПП организуется пропускной режим с целью контроля входа и выхода лиц.

3.5.2. Каждое лицо, входящее на территорию ГвВК, обязано:
- Предъявить документ, удостоверяющий личность
- Пройти процедуру регистрации
- Получить пропуск (при необходимости)

3.5.3. Военнослужащие ГвВК проходят без пропуска, но с предъявлением военного билета или служебного удостоверения.

3.5.4. Гражданский персонал допускается на территорию ГвВК в соответствии с приказом Начальника ГвВК и по спискам, утвержденным Начальником штаба.

3.5.5. При отсутствии надлежащего документа часовой не допускает лицо на территорию и докладывает Дежурному по ГвВК.

3.6. Прием и сдача поста

3.6.1. Прием и сдача поста производится согласно установленному регламенту в установленное время.

3.6.2. Сменяемый часовой докладывает приходящему:
- Номер поста и охраняемый объект
- Пароль и отзыв на день
- Возможные проблемы и неисправности
- Происходящие события и изменения обстановки
- Время последней проверки поста командиром

3.6.3. Приходящий часовой производит:
- Осмотр поста на предмет целостности ограждения и освещения
- Проверку исправности оружия и оборудования
- Проверку средств связи
- Регистрацию в журнале приема и сдачи поста

3.6.4. После выполнения всех процедур сменяемый часовой имеет право покинуть пост.

3.7. Порядок действия при возникновении чрезвычайных ситуаций

3.7.1. При попытке несанкционированного входа на пост или вблизи него часовой:
- Подает команду «Стой! Кто идет?»
- Проверяет документы
- При отказе предъявить документы и попытке прорваться — использует физическую силу
- При вооруженном нападении — открывает огонь в соответствии с боевыми приказами
- Немедленно докладывает Дежурному по ГвВК

3.7.2. При возникновении пожара:
- Поднимается тревога
- Эвакуируется личный состав
- Приводится в готовность противопожарное оборудование
- Вызывается пожарная служба
- Докладывается Дежурному по ГвВК

3.7.3. При получении боевого приказа все караулы переходят в боевое положение и становятся под оружие согласно установленным боевым приказам.

Глава 4. ОРГАНИЗАЦИЯ РАЗВЕДЫВАТЕЛЬНОЙ ДЕЯТЕЛЬНОСТИ

4.1. Назначение и задачи разведки

4.1.1. Разведка — это система мероприятий по добыванию информации о противнике, угрозах и состоянии территории.

4.1.2. Основные задачи разведки:
- Вскрытие намерений и действий противника
- Выявление и предотвращение диверсионно-террористической деятельности
- Сбор информации о состоянии граждан на подконтрольной территории
- Выявление нарушителей режима и их нейтрализация
- Добывание разведывательной информации в интересах командования

4.1.3. Разведка ведется непрерывно в мирное и военное время.

4.2. Организация разведки в ГвВК

4.2.1. Разведка в ГвВК организуется на основе:
- Плана боевой подготовки
- Директив командующего округом
- Приказов Начальника ГвВК
- Плана разведки, утвержденного Начальником штаба

4.2.2. В состав разведотдела входят:
- Начальник разведки (офицер не ниже звания капитана)
- Помощник начальника разведки
- Группы разведчиков
- Специалисты по анализу информации

4.2.3. Численность разведотдела определяется Начальником ГвВК.

4.3. Виды разведки

4.3.1. В ГвВК применяются следующие виды разведки:
Наблюдение — Постоянное визуальное наблюдение с наблюдательных постов — Начальник наблюдательного поста
Подслушивание — Перехват радиопереговоров и прочей информации — Специалист по технической разведке
Разведывательные группы — Сбор информации путем движения на местности и проведения операций — Командир разведгруппы
Техническая разведка — Перехват сигналов, видеонаблюдение, анализ открытых источников — Инженер по разведке
Контрразведка — Выявление агентов противника и их нейтрализация — Начальник контрразведки
Анализ информации — Обработка и анализ полученной информации — Аналитик разведки

4.4. Разведывательные группы

4.4.1. Разведывательная группа — это специально подготовленное подразделение численностью 3–10 человек, предназначенное для сбора информации путем движения на местности.

4.4.2. Состав типовой разведывательной группы:
- Командир группы (сержант или старший сержант)
- Помощник командира (младший сержант)
- Разведчик-наблюдатель (2–3 человека)
- Специалист по ориентированию (1 человек)
- Боевик-обеспечение (1–2 человека)

4.4.3. Разведывательные группы ведут разведку:
- Скрытым передвижением на местности
- Наблюдением с укрытых позиций
- Перехватом переговоров и сигналов
- Сбором образцов и предметов (для анализа)
- Фотографированием и видеосъемкой

4.4.4. Все разведгруппы оснащаются:
- Оружием (автоматы, пистолеты)
- Рацией или портативным радио
- Приборами ночного видения
- Навигационным оборудованием
- Средствами первой помощи
- Сухим пайком на время операции

4.5. Обязанности начальника разведки

4.5.1. Начальник разведки обязан:
1. Разрабатывать и представлять Начальнику ГвВК план разведки
2. Организовывать подготовку разведчиков к выполнению задач
3. Проводить инструктаж перед каждой операцией
4. Контролировать ведение разведки в ходе операции
5. Своевременно докладывать о полученной информации
6. Вести журнал регистрации разведданных
7. Организовывать анализ информации
8. Обеспечивать безопасность разведчиков
9. Дежурить в штабе во время проведения операций
10. Подготавливать отчеты о проведенных разведывательных мероприятиях

4.6. Обязанности командира разведывательной группы

4.6.1. Командир разведывательной группы несет полную ответственность за выполнение поставленной задачи и безопасность личного состава группы.

4.6.2. Командир разведывательной группы обязан:
1. Четко уяснить поставленную задачу
2. Провести инструктаж личного состава группы о задаче, маршруте движения, опасностях и порядке действия при встрече с противником
3. Проверить готовность оружия, оборудования и снаряжения
4. Организовать движение группы согласно утвержденному маршруту
5. Соблюдать скрытность и ориентировку на местности
6. Ежечасно докладывать о местоположении группы и статусе выполнения задачи
7. При выявлении целей противника — пресекать их деятельность в соответствии с боевыми приказами
8. Обеспечивать безопасность личного состава группы
9. Своевременно возвращаться на базу
10. Подготавливать доклад о проведенной операции

4.7. Порядок планирования и организации разведывательной операции

4.7.1. План разведывательной операции включает:
1. Цель операции — какая информация должна быть получена
2. Район разведки — территория, на которой будет проводиться разведка
3. Состав группы — число и звания разведчиков, их специализация
4. Время проведения — дата и время начала и окончания операции
5. Маршрут движения — путь, по которому будет двигаться группа
6. Ориентиры и контрольные точки — места, где должна находиться группа в установленное время
7. Способ ведения разведки — наблюдение, подслушивание, фотографирование, захват образцов и т.д.
8. Порядок докладывания — когда и как командир группы докладывает о ходе операции
9. Порядок эвакуации — что делать при ранении или захвате члена группы
10. Условные сигналы и коды — слова и жесты для передачи информации при возникновении опасности

4.7.2. План разведывательной операции утверждается Начальником ГвВК или его заместителем (по характеру операции).

4.7.3. Все члены разведывательной группы перед операцией проходят инструктаж, на котором им доводятся:
- Цель и задачи операции
- Районы возможного нахождения противника
- Сигналы и коды
- Порядок возвращения на базу
- Порядок оказания первой помощи

4.8. Контрразведывательная деятельность

4.8.1. Контрразведка предназначена для:
- Выявления агентов противника внутри ГвВК
- Предотвращения утечек информации
- Пресечения диверсионной и террористической деятельности
- Обеспечения безопасности объектов и персонала

4.8.2. В состав контрразведки входят специально подготовленные офицеры ФСБ и собственные специалисты ГвВК.

4.8.3. Контрразведка имеет право:
- Проводить опросы военнослужащих
- Осматривать помещения и личные вещи
- Ограничивать контакты с внешним миром
- Задерживать лиц при подозрении в шпионаже или диверсии

ЧАСТЬ III. УСТАВ ГАРНИЗОННОЙ СЛУЖБЫ
Глава 5. ОРГАНИЗАЦИЯ ГАРНИЗОННОЙ СЛУЖБЫ

5.1. Назначение и задачи гарнизонной службы

5.1.1. Гарнизонная служба организуется с целью:
- Обеспечения безопасности и правопорядка в гарнизоне
- Охраны государственного имущества
- Оказания помощи органам прокуратуры и органам внутренних дел
- Поддержания строгого режима в воинской части
- Проведения воспитательной работы с населением гарнизона

5.1.2. Гарнизонная служба в ГвВК организуется Начальником ГвВК совместно с командующим гарнизоном.

5.2. Права и обязанности гарнизонной команды

5.2.1. Гарнизонная команда ГвВК имеет право:
- Требовать предъявления документов у лиц, находящихся в гарнизоне
- Останавливать и проверять военные автомашины
- Задерживать лиц, нарушивших режим гарнизона, до прибытия органов внутренних дел
- Издавать приказы о восстановлении правопорядка
- Применять физическую силу при сопротивлении

5.2.2. Гарнизонная команда обязана:
- Патрулировать территорию гарнизона согласно утвержденному маршруту
- Реагировать на сообщения о правонарушениях
- Содействовать органам прокуратуры и органам внутренних дел
- Докладывать о выявленных нарушениях
- Вести журналы учета происходящих событий

5.3. Организация гарнизонного наряда

5.3.1. Гарнизонный наряд выставляется из расчета:
- 1 дежурный офицер (капитан или старший лейтенант)
- 2–4 разъездных (сержанты)
- 4–6 пеших патрульных (рядовые и младшие сержанты)

5.3.2. Смена гарнизонного наряда производится ежесуточно в 08:00.

5.3.3. Маршруты патрулирования устанавливаются приказом Начальника ГвВК.

5.4. Порядок задержания нарушителя режима

5.4.1. При выявлении нарушителя режима гарнизонный наряд обязан:
1. Потребовать остановиться и предъявить документы
2. Выяснить фамилию, имя, отчество, воинское звание (если военнослужащий), место прохождения службы
3. Указать допущенное нарушение
4. При согласии нарушителя сопровождают его в отделение полиции или военной прокуратуры
5. При отказе следовать приказам — используется физическая сила и задержание
6. Незамедлительно докладывается Дежурному по ГвВК

5.4.2. Недопустимо применение оружия при задержании гражданских лиц без вооружения.

Глава 6. ОРГАНИЗАЦИЯ ВНУТРЕННЕГО ПОРЯДКА И ДИСЦИПЛИНЫ

6.1. Основные принципы воинской дисциплины

6.1.1. Воинская дисциплина основывается на:
- Сознательном понимании долга
- Чести и достоинстве военнослужащего
- Личной ответственности
- Взаимном уважении
- Справедливости и равенстве перед законом

6.1.2. Воинская дисциплина обеспечивается:
- Правильной организацией боевой подготовки
- Обучением и воспитанием
- Справедливым применением мер поощрения и взыскания
- Укреплением авторитета командиров и начальников

6.2. Обязанности командиров и начальников по поддержанию дисциплины

6.2.1. Командиры обязаны:
1. Лично пример дисциплинированности и надлежащего поведения
2. Справедливое применение мер поощрения и взыскания
3. Своевременное выявление и пресечение нарушений дисциплины
4. Знание психологических особенностей подчиненных
5. Проведение профилактической воспитательной работы
6. Ежедневный контроль за соблюдением режима дня
7. Справедливое разрешение конфликтов и споров

6.2.2. Запрещается командирам:
- Унижение достоинства подчиненных
- Применение оружия или предметов для наказания
- Запирание в помещениях без законного основания
- Лишение продуктов питания в качестве наказания
- Издание приказов, противоречащих законодательству

6.3. Система поощрений

6.3.1. За образцовое несение службы и хорошее поведение применяются поощрения:
Объявление благодарности — Командир батальона — За успешное выполнение задачи, помощь товарищу
Объявление благодарности с занесением в личное дело — Начальник ГвВК — За систематическое добросовестное служение
Денежная премия — Начальник ГвВК — За проявление инициативы, выслугу лет
Благодарственное письмо родителям — Начальник ГвВК — За героизм, спасение жизни товарища
Вручение ценного подарка — Начальник ГвВК — За отличное служение и преданность
Предоставление отпуска или побывки — Начальник ГвВК — За хорошее поведение и служение

6.4. Система взысканий

6.4.1. За нарушение дисциплины применяются взыскания:
Устное замечание — Командир роты — За мелкие нарушения режима дня
Письменное замечание — Командир батальона — За нарушение внутреннего порядка
Лишение выходного дня — Начальник ГвВК — За недобросовестное несение службы
Лишение части денежного довольствия — Начальник ГвВК — За кражу, порчу имущества
Возбуждение уголовного дела — Военная прокуратура — За серьезные преступления
Исключение из рядов ВС РФ — Министр обороны РФ — За преступления против службы

6.4.2. Взыскание применяется немедленно после выявления нарушения, но не позднее 10 дней.

6.4.3. Взыскание может быть снято командиром до истечения срока при условии образцового поведения нарушителя (не ранее одного месяца).

6.5. Порядок разбирательства при нарушении дисциплины

6.5.1. При нарушении дисциплины командир обязан:
1. Выяснить обстоятельства произошедшего
2. Вызвать нарушителя и выслушать его объяснение
3. Проверить данные, собрав сведения у свидетелей
4. Принять справедливое решение
5. Объявить решение в приказе

6.5.2. Нарушитель имеет право:
- Знать, в чем его обвиняют
- Дать объяснение
- Привести свидетелей
- Обжаловать решение командира у вышестоящего начальника

6.6. Борьба с дедовщиной и издевательством

6.6.1. Дедовщина — это систематическое унижение, издевательство и физическое насилие в отношении младших по служебному положению или сроку службы военнослужащих.

6.6.2. Дедовщина решительно и жестко пресекается командирами всех уровней.

6.6.3. Лица, допускающие дедовщину, подлежат дисциплинарному взысканию и привлечению к уголовной ответственности.

6.6.4. Для выявления и пресечения дедовщины:
- Проводятся беседы с личным составом
- Ведется мониторинг социальных групп в интернете
- Создаются благоприятные условия для доносительства на анонимной основе
- Осуществляется психологическое сопровождение подвергшихся издевательству лиц

ЧАСТЬ IV. УСТАВ БОЕВОЙ ПОДГОТОВКИ

Глава 7. ОРГАНИЗАЦИЯ БОЕВОЙ ПОДГОТОВКИ

7.1. Назначение и цели боевой подготовки

7.1.1. Боевая подготовка — это система учебно-тренировочных занятий, предназначенных для обучения личного состава ГвВК выполнению боевых задач в различных условиях обстановки.

7.1.2. Цели боевой подготовки:
- Обучение действиям в боевых условиях
- Развитие тактических и стрелковых навыков
- Подготовка командиров к руководству подразделениями
- Поддержание боевой готовности
- Совершенствование физической подготовки

7.2. Предметы боевой подготовки

Стрелковая подготовка — 40 часов — Офицер по боевой подготовке
Тактическая подготовка — 60 часов — Командир батальона
Инженерная подготовка — 30 часов — Инженер части
Радиационная, химическая и биологическая защита — 20 часов — Начальник РХБЗ
Топография и ориентирование — 20 часов — Офицер разведки
Строевая подготовка — 30 часов — Старший сержант по строевой подготовке
Физическая подготовка — 60 часов — Инструктор по физподготовке
Приемы рукопашного боя — 40 часов — Инструктор по рукопашному бою

7.3. Организация боевых учений

7.3.1. Боевые учения проводятся в соответствии с приказом Начальника ГвВК и утвержденной программой боевой подготовки.

7.3.2. Виды учений:
- Тактико-специальные учения (в условиях, приближенных к боевым)
- Полевые учения (с выходом подразделений в поле)
- Стрельбы (боевые, тренировочные)
- Маневры (движение и развертывание подразделений)

7.3.3. Перед проведением учений назначается:
- Начальник учения (офицер не ниже звания майора)
- Главный судья учения
- Судейская коллегия
- Санитарно-медицинское обеспечение

7.4. Меры безопасности при боевой подготовке

7.4.1. При проведении боевой подготовки строго соблюдаются меры безопасности:
- Все оружие используется только по назначению
- При выполнении упражнений обеспечивается безопасная дистанция между стрелками
- Использование боевых патронов производится только на утвержденных полигонах
- Проведение учений согласуется с вышестоящим командованием
- Ведется медицинское обеспечение и оказание первой помощи

ЧАСТЬ V. УСТАВ О ПРАВАХ И ОБЯЗАННОСТЯХ ВОЕННОСЛУЖАЩИХ

Глава 8. ОСНОВНЫЕ ПРАВА И ОБЯЗАННОСТИ

8.1. Основные права военнослужащих

8.1.1. Каждый военнослужащий ГвВК имеет право на:
1. Защиту чести и достоинства — никто не вправе унижать честь и достоинство военнослужащего
2. Справедливое разбирательство — при применении взысканий имеет право на справедливое разбирательство
3. Защиту в судебном порядке — право на рассмотрение спора в военном суде
4. Социальные гарантии — выплата денежного довольствия, предоставление медицинской помощи
5. Отпуск и побывку — ежегодный отпуск в соответствии с графиком
6. Благоустроенное жилище — предоставление казармы, спального места
7. Полноценное питание — питание согласно нормам военного рациона
8. Информацию — получение информации о своих правах и обязанностях
9. Обращение — право подать жалобу на действия командира и вышестоящее начальство
10. Защиту в случае ранения или плена — гарантии защиты в соответствии с международным правом

8.2. Основные обязанности военнослужащих

8.2.1. Каждый военнослужащий ГвВК обязан:
1. Верно служить Отечеству — добросовестно выполнять боевые и служебные задачи
2. Соблюдать воинскую присягу — выполнять данные при присяге обещания
3. Соблюдать законодательство — подчиняться Конституции и федеральным законам РФ
4. Подчиняться командирам и начальникам — следовать приказам вышестоящего начальства
5. Соблюдать режим воинской части — выполнять установленный распорядок дня
6. Поддерживать боевую готовность — участвовать в боевой и физической подготовке
7. Беречь государственное имущество — сохранять вооружение, технику и имущество
8. Охранять государственную тайну — не разглашать сведения, составляющие государственную тайну
9. Содействовать правопорядку — помогать органам правоохраны в пресечении преступлений
10. Совершенствовать боевое мастерство — постоянно развивать свои профессиональные навыки

8.3. Ответственность военнослужащих

8.3.1. Военнослужащие несут ответственность:
- Дисциплинарную — наложение дисциплинарных взысканий
- Материальную — возмещение вреда, причиненного государству
- Административную — наложение административных штрафов
- Уголовную — привлечение к уголовной ответственности за совершение преступлений

9.3. Формирование коллектива

9.3.1. Командиры обязаны:
- Развивать чувство товарищества и взаимной ответственности
- Способствовать сплочению коллектива

4. Проводится инструктаж личного состава
5. Подразделения занимают установленные позиции
6. Осуществляется взаимодействие с соседними подразделениями

Кодекс распространяется на всех лиц, находящихся в пределах административной территории ЗАТО-87.
